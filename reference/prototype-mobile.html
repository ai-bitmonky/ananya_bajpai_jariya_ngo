<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7B1E2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Zariya: learn a skill, find schemes and work close to home.">
<title>Zariya ज़रिया</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* ZARIYA ज़रिया — design tokens (single source of truth; inline into every HTML file)
   Layout concept: warm cream canvas, maroon as the ONE bold colour, blush for soft surfaces,
   outlined Devanagari wordmark as motif. No pure black, no pure white, no mid-grey. */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap');

:root{
  /* brand */
  --maroon:#7B1E2E;        /* primary – buttons, active tab, wordmark */
  --maroon-deep:#5E1423;   /* pressed, dark gradients */
  --maroon-soft:#9A3A49;   /* hover, secondary emphasis */
  --blush:#E9CCCF;         /* soft surfaces, chips */
  --blush-pale:#F6E6E7;    /* tints, selected rows */
  --rose:#C4616F;          /* progress fills on light surfaces */
  --cream:#FBF4EE;         /* page background */
  --cream-deep:#F3E8DF;    /* sunken areas, inputs */
  --paper:#FFFBF8;         /* cards (never #fff) */
  --ink:#2B1A1D;           /* primary text (maroon-biased near-black) */
  --ink-2:#5C4A4D;         /* secondary text */
  --ink-3:#8E7B7E;         /* tertiary / placeholders */
  --line:#E6D6D2;          /* hairlines */
  --gold:#C99A3C;          /* certificate, stars, "for me" match */
  --gold-pale:#F5E7C6;
  --leaf:#4E7D5B;          /* success / eligible */
  --leaf-pale:#DDEBE0;
  --sky:#3F6E8C;           /* info / links inside content */
  --sky-pale:#DCE8F0;
  --alert:#B4432F;         /* urgency ("5 seats left") */
  --alert-pale:#F6DCD6;

  /* semantic aliases (components use these) */
  --bg:var(--cream);
  --bg-2:var(--cream-deep);
  --surface:var(--paper);
  --surface-2:var(--blush-pale);
  --fg:var(--ink);
  --fg-2:var(--ink-2);
  --fg-3:var(--ink-3);
  --accent:var(--maroon);
  --accent-fg:#FFF6F3;
  --accent-soft:var(--blush);
  --border:var(--line);
  --focus:0 0 0 3px rgba(123,30,46,.28);

  /* type */
  --font-display:'Baloo 2','Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Mukta','Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-hero:34px;  --fs-h1:26px; --fs-h2:20px; --fs-h3:17px;
  --fs-body:16px;  --fs-sm:14px; --fs-xs:12.5px; --fs-micro:11px;
  --lh-tight:1.15; --lh-body:1.5;

  /* shape */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-pill:999px;

  /* elevation (maroon-tinted, never grey) */
  --sh-1:0 1px 2px rgba(94,20,35,.06), 0 1px 3px rgba(94,20,35,.05);
  --sh-2:0 6px 18px rgba(94,20,35,.10), 0 1px 3px rgba(94,20,35,.06);
  --sh-3:0 18px 48px rgba(94,20,35,.18);
  --sh-up:0 -8px 24px rgba(94,20,35,.10);

  /* motion */
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-arrive:cubic-bezier(.16,1,.3,1);   /* screens, sheets entering */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:160ms; --dur-std:280ms; --dur-slow:420ms; --dur-arrive:560ms;

  /* spacing scale: 4 8 12 16 20 24 32 40 48 64 */
  --tap:48px;               /* minimum touch target */
  color-scheme:light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1113; --bg-2:#221619; --surface:#261A1D; --surface-2:#33232A;
    --fg:#F6E9E6; --fg-2:#CDB7B9; --fg-3:#9A8588;
    --accent:#D96F7E; --accent-fg:#1F0E12; --accent-soft:#4A2A33;
    --border:#3B2A2E; --focus:0 0 0 3px rgba(217,111,126,.35);
    --blush-pale:#33232A; --blush:#4A2A33; --cream-deep:#221619; --paper:#261A1D;
    --gold:#E2B45C; --gold-pale:#3E3220; --leaf:#7DB38A; --leaf-pale:#223328;
    --sky:#7FA9C4; --sky-pale:#1F2E38; --alert:#E07A66; --alert-pale:#3E241F;
    --rose:#D96F7E;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6); --sh-up:0 -8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1113; --bg-2:#221619; --surface:#261A1D; --surface-2:#33232A;
  --fg:#F6E9E6; --fg-2:#CDB7B9; --fg-3:#9A8588;
  --accent:#D96F7E; --accent-fg:#1F0E12; --accent-soft:#4A2A33;
  --border:#3B2A2E; --focus:0 0 0 3px rgba(217,111,126,.35);
  --blush-pale:#33232A; --blush:#4A2A33; --cream-deep:#221619; --paper:#261A1D;
  --gold:#E2B45C; --gold-pale:#3E3220; --leaf:#7DB38A; --leaf-pale:#223328;
  --sky:#7FA9C4; --sky-pale:#1F2E38; --alert:#E07A66; --alert-pale:#3E241F;
  --rose:#D96F7E;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6); --sh-up:0 -8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* base */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display{font-family:var(--font-display);line-height:var(--lh-tight);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* signature motif: outlined Devanagari wordmark */
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.wordmark--outline{color:transparent;-webkit-text-stroke:1.5px currentColor;opacity:.22}

/* block-print texture (use as background-image on hero/brand bands, opacity via colour alpha) */
/* a 4-petal "buta" motif — tile 56px */
:root{
  --buta:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='rgba(255,246,243,0.16)' stroke-width='1.2'><path d='M28 10c4 6 4 12 0 18-4-6-4-12 0-18zM28 28c4 6 4 12 0 18-4-6-4-12 0-18zM10 28c6-4 12-4 18 0-6 4-12 4-18 0zM28 28c6-4 12-4 18 0-6 4-12 4-18 0z'/><circle cx='28' cy='28' r='2.2'/><circle cx='4' cy='4' r='1.2'/><circle cx='52' cy='52' r='1.2'/></g></svg>");
}

</style>
<style>
/* ================= ZARIYA MOBILE ================= */
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3,html[lang=hi] .display{line-height:1.25}
html,body{height:100%;overflow:hidden}
:root{--on-band:var(--cream);--tabh:calc(70px + env(safe-area-inset-bottom));--toast-b:calc(var(--tabh) + 12px)}
html.big{--fs-hero:37px;--fs-h1:28px;--fs-h2:22px;--fs-h3:18.5px;--fs-body:17.5px;--fs-sm:15.5px;--fs-xs:14px;--fs-micro:12.5px}
body{overscroll-behavior:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;overflow:clip;isolation:isolate}
@media (min-width:481px){
  body{background:var(--maroon-deep);background-image:var(--buta),radial-gradient(120% 80% at 50% 0%,var(--maroon) 0%,var(--maroon-deep) 70%);background-size:56px,100% 100%}
  #app{max-width:420px;box-shadow:var(--sh-3),0 0 0 1px color-mix(in srgb,var(--cream) 10%,transparent)}
}
#stage{flex:1;position:relative;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;overflow:clip;will-change:transform}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar,.hs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
[data-tabs=on] .screen.is-root .scroll{padding-bottom:calc(var(--tabh) + 20px)}
button,a,.tab,.bar,#tabbar,.chip,.seg,.tabs{user-select:none;-webkit-user-select:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
input,select,textarea{user-select:text;-webkit-user-select:text}
svg{flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* press states */
.press,button,[role=button]{transition:transform var(--dur-fast) var(--ease-standard),background-color var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast),opacity var(--dur-fast)}
button:active:not(:disabled),.press:active{transform:scale(.97)}
.card.press:active,.hcard:active{transform:scale(.985)}

/* top app bar */
.bar{height:calc(56px + 8px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 8px 0 8px;display:flex;align-items:center;gap:4px;flex:none;position:relative;z-index:3;background:var(--bg)}
.bar-t{flex:1;min-width:0;font-size:var(--fs-h2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bar-r{display:flex;align-items:center;gap:2px;flex:none}
.bar.lined{box-shadow:0 1px 0 var(--border)}
.ib{width:var(--tap);height:var(--tap);border-radius:var(--r-pill);display:grid;place-items:center;color:var(--fg);position:relative;flex:none}
.ib:active{background:var(--surface-2)}
.ib .dot{position:absolute;top:12px;right:13px;width:9px;height:9px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 2px var(--bg)}
.on-band .ib,.ib.on-band{color:var(--on-band)}
.on-band .ib .dot,.ib.on-band .dot{box-shadow:0 0 0 2px var(--maroon)}
.ib--glass{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-1);width:44px;height:44px;margin:2px}
.lang{height:36px;min-width:var(--tap);padding:3px;border-radius:var(--r-pill);display:inline-flex;align-items:center;background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:13px;line-height:1;position:relative;margin:6px 2px}
.lang::before{content:'';position:absolute;inset:-6px 0}
.lang span{height:30px;min-width:34px;padding:0 8px;display:grid;place-items:center;border-radius:var(--r-pill);color:var(--fg-2);transition:background-color var(--dur-std) var(--ease-emphasized),color var(--dur-std)}
.lang span.on{background:var(--accent);color:var(--accent-fg)}
.lang--band{background:color-mix(in srgb,var(--cream) 16%,transparent)}
.lang--band span{color:var(--on-band)}
.lang--band span.on{background:var(--on-band);color:var(--maroon)}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1;color:var(--cream);background:var(--hue,var(--rose));flex:none;padding-top:2px}
.av-btn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%}
.av--me{background:var(--accent-soft);color:var(--accent)}
.av--band{background:var(--on-band);color:var(--maroon);box-shadow:0 0 0 3px color-mix(in srgb,var(--cream) 22%,transparent)}
.stack{display:flex}
.stack .av{width:26px;height:26px;font-size:12px;box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-left:-8px}

/* type helpers */
.h-sec{font-size:var(--fs-h2);font-weight:700}
.sub{color:var(--fg-2);font-size:var(--fs-sm)}
.muted{color:var(--fg-3);font-size:var(--fs-xs)}
.clamp1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* sections */
.sec{padding:24px 16px 0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;min-height:32px}
.sec-h h2{font-size:var(--fs-h2);min-width:0}
.link{color:var(--accent);font-weight:600;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:2px;min-height:var(--tap);padding:0 4px;margin:-8px -4px;flex:none}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none;overscroll-behavior-x:contain}
.hs>*{scroll-snap-align:start;flex:none}

/* cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-1);position:relative}
.card--line{box-shadow:none;border:1px solid var(--border)}

/* buttons */
.btn{min-height:52px;padding:0 22px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-fg);font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px color-mix(in srgb,var(--maroon) 26%,transparent);text-align:center}
.btn:active:not(:disabled){filter:brightness(.92)}
.btn--block{width:100%}
.btn--sm{min-height:var(--tap);padding:0 18px;font-size:15.5px}
.btn--2{background:var(--surface-2);color:var(--accent);box-shadow:none}
.btn--line{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.btn--ghost{background:transparent;color:var(--accent);box-shadow:none}
.btn--leaf{background:var(--leaf-pale);color:var(--leaf);box-shadow:none}
.btn:disabled{opacity:.5}
.btn svg{margin-top:-1px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 12px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--fg-2);font-size:var(--fs-xs);font-weight:600;line-height:1.2;white-space:nowrap}
.chip--leaf{background:var(--leaf-pale);color:var(--leaf)}
.chip--gold{background:var(--gold-pale);color:color-mix(in srgb,var(--gold) 70%,var(--fg))}
.chip--alert{background:var(--alert-pale);color:var(--alert)}
.chip--sky{background:var(--sky-pale);color:var(--sky)}
.chip--line{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
button.chip{min-height:40px;padding:0 16px;font-size:var(--fs-sm);position:relative}
button.chip::after{content:'';position:absolute;inset:-4px 0}
button.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;margin:0 -16px;scrollbar-width:none}
.tick{width:22px;height:22px;border-radius:50%;background:var(--leaf);color:var(--leaf-pale);display:grid;place-items:center;flex:none}
.tick svg{width:14px;height:14px}

/* progress */
.pbar{height:8px;border-radius:var(--r-pill);background:var(--bg-2);overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--rose),var(--accent));transform-origin:left;transform:scaleX(var(--p));animation:fill 1.1s var(--ease-arrive) both .15s}
.pbar--leaf i{background:var(--leaf)}
@keyframes fill{from{transform:scaleX(0)}}
.no-anim .pbar i,.no-anim .ring-v,.no-anim .rise,.no-anim .bars i{animation:none!important}

/* course art */
.art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--a0),var(--a1));border-radius:var(--r-md);color:var(--cream);isolation:isolate}
.art::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px 56px;z-index:-1}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,color-mix(in srgb,var(--maroon-deep) 48%,transparent),transparent 58%);z-index:-1}
.art-i{position:absolute;right:-4%;bottom:-6%;width:50%;height:auto;aspect-ratio:1;opacity:.34;color:var(--cream);z-index:-1}
.art-t{position:absolute;left:12px;right:12px;bottom:10px;font-family:var(--font-display);font-weight:700;font-size:var(--fs-h3);line-height:1.2;text-shadow:0 1px 8px color-mix(in srgb,var(--maroon-deep) 50%,transparent)}
.art--sq .art-i{width:78%;right:-10%;bottom:-12%}

/* scheme mark */
.mark{width:44px;height:44px;border-radius:var(--r-sm);background:var(--hue);color:var(--cream);display:grid;place-items:center;text-align:center;font-family:var(--font-display);font-weight:800;line-height:.95;letter-spacing:-.02em;flex:none;padding:3px 2px 0;overflow:hidden;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--maroon-deep) 22%,transparent)}

/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--border);transition:transform var(--dur-slow) var(--ease-emphasized)}
[data-tabs=off] #tabbar{transform:translateY(110%)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;color:var(--fg-3);font-size:11px;font-weight:600;line-height:1.2;padding-top:2px;border-radius:var(--r-md)}
.tab:active{transform:none}
.tab-i{width:60px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;transition:background-color var(--dur-std) var(--ease-emphasized),transform var(--dur-fast)}
.tab:active .tab-i{transform:scale(.92)}
.tab[aria-current=page]{color:var(--accent)}
.tab[aria-current=page] .tab-i{background:var(--accent-soft);animation:pill var(--dur-slow) var(--ease-emphasized)}
@keyframes pill{from{transform:scaleX(.4);opacity:.4}}
.tab-l{max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toast */
#toast{position:absolute;left:16px;right:16px;bottom:var(--toast-b);z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast .t{max-width:100%;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:500;box-shadow:var(--sh-3);display:flex;gap:10px;align-items:center;animation:toastIn var(--dur-slow) var(--ease-arrive) both}
#toast .t svg{color:var(--leaf-pale)}
#toast .t.out{animation:toastOut var(--dur-std) var(--ease-standard) both}
@keyframes toastIn{from{transform:translateY(24px);opacity:0}}
@keyframes toastOut{to{transform:translateY(16px);opacity:0}}

/* sheets */
#sheets{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden;overflow:clip}
#sheets.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 48%,transparent);opacity:0;transition:opacity var(--dur-std)}
#sheets.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-up);padding:0 0 calc(16px + env(safe-area-inset-bottom));outline:none;transform:translateY(100%)}
.grab{height:28px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
.grab i{width:36px;height:4px;border-radius:2px;background:var(--border)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:0 8px 8px 20px;flex:none}
.sheet-h h2{flex:1;font-size:var(--fs-h2)}
.sheet-b{overflow-y:auto;padding:0 20px;scrollbar-width:none;overscroll-behavior:contain}
.sheet-b::-webkit-scrollbar{display:none}
.sheet-f{padding:16px 20px 0;display:grid;gap:8px;flex:none}

/* skeleton */
.sk{background:linear-gradient(100deg,var(--bg-2) 30%,var(--surface-2) 50%,var(--bg-2) 70%);background-size:300% 100%;animation:shim 1.1s linear infinite;border-radius:var(--r-lg)}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}

/* rise-in for content blocks (one orchestrated moment per screen) */
.rise{animation:rise var(--dur-arrive) var(--ease-arrive) both;animation-delay:calc(var(--i,0) * 55ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* maroon band */
.band{background:linear-gradient(160deg,var(--maroon) 0%,var(--maroon-deep) 100%);color:var(--on-band);position:relative;overflow:hidden;isolation:isolate}
.band::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px 56px;z-index:-1}
.wm-bleed{position:absolute;z-index:-1;white-space:nowrap;pointer-events:none;line-height:1.1}
.wordmark--outline.wm-bleed,.spl-rows .wordmark--outline{color:transparent;-webkit-text-stroke:1.5px var(--on-band);opacity:.3}

/* inputs */
.field{display:grid;gap:6px}
.field>span{font-size:var(--fs-sm);font-weight:600;color:var(--fg-2)}
.inp{height:56px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--border);padding:0 16px;font-size:18px;width:100%;outline:none;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.inp:focus{border-color:var(--accent);box-shadow:var(--focus)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 22px) 25px,calc(100% - 16px) 25px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}

/* search pill */
.search{display:flex;align-items:center;gap:6px;height:54px;border-radius:var(--r-pill);background:var(--surface);color:var(--fg-3);padding:0 4px 0 16px;box-shadow:var(--sh-1);position:relative}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:var(--fs-body);color:var(--fg)}
.search input::placeholder{color:var(--fg-3)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:var(--sh-1),var(--focus)}
.mic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);flex:none}
.search--flat{background:var(--bg-2);box-shadow:none;height:50px}
.search .lbars{display:none;gap:3px;align-items:center;height:18px}
.search .lbars i{width:3px;height:100%;border-radius:2px;background:currentColor;animation:lb .7s ease-in-out infinite alternate}
.search .lbars i:nth-child(2){animation-delay:.15s}.search .lbars i:nth-child(3){animation-delay:.3s}
@keyframes lb{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.search.listening .lbars{display:flex}
.search.listening .mic>svg{display:none}
.search.listening .mic{animation:pulse 1.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.search.listening input::placeholder{color:var(--accent);font-weight:600}

/* list rows */
.row{display:flex;align-items:center;gap:14px;padding:12px 0;min-height:64px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--border)}
.row-b{flex:1;min-width:0}
.row-t{font-weight:600;font-size:var(--fs-body);line-height:1.3}
.chev{color:var(--fg-3)}

/* switch */
.sw{width:52px;height:32px;border-radius:var(--r-pill);background:var(--bg-2);box-shadow:inset 0 0 0 1.5px var(--border);position:relative;flex:none;transition:background-color var(--dur-std)}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--fg-3);transition:transform var(--dur-std) var(--ease-spring),background-color var(--dur-std)}
[aria-pressed=true] .sw,.sw[aria-pressed=true]{background:var(--accent);box-shadow:none}
[aria-pressed=true] .sw::after,.sw[aria-pressed=true]::after{transform:translateX(20px);background:var(--accent-fg)}

/* sticky foot CTA */
.foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--border);display:grid;gap:4px;z-index:4}

/* ---------- HOME ---------- */
.home-band{padding:calc(6px + env(safe-area-inset-top)) 16px 26px;border-radius:0 0 var(--r-xl) var(--r-xl)}
.home-band .wm-bleed{font-size:150px;right:-64px;top:34px;letter-spacing:-.03em}
.band-row{display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -8px 0 -4px}
.band-r{display:flex;align-items:center;gap:2px}
.greet{font-size:var(--fs-h1);font-weight:800;margin-top:10px;color:var(--on-band)}
.greet-sub{color:color-mix(in srgb,var(--cream) 78%,transparent);font-size:var(--fs-sm);margin-top:2px}
.home-band .search{margin-top:18px;box-shadow:0 10px 26px color-mix(in srgb,var(--maroon-deep) 45%,transparent)}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 16px 0}
.stat{padding:12px 14px;display:flex;align-items:center;gap:12px;min-height:72px}
.stat b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.15;font-weight:800}
.stat small{display:block;color:var(--fg-2);font-size:var(--fs-xs);line-height:1.3}
.flame{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--gold-pale);flex:none}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring-v{animation:ringIn 1.2s var(--ease-arrive) both .2s}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px!important;font-family:var(--font-body)!important;font-weight:700!important;padding-top:1px}
.hero{padding:14px;overflow:hidden}
.hero-top{display:flex;gap:14px;align-items:center}
.hero .art{width:84px;height:84px;border-radius:var(--r-md)}
.hero-eb{color:var(--accent);font-size:var(--fs-xs);font-weight:700;letter-spacing:.02em}
.hero h3{font-size:var(--fs-h3);margin-top:2px}
.hero-p{display:flex;align-items:center;gap:10px;margin:14px 0 14px}
.hero-p .pbar{flex:1}
.hero-p span{font-size:var(--fs-sm);font-weight:700;color:var(--fg-2)}
.schm{width:min(68vw,236px);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:156px}
.schm-top{display:flex;justify-content:space-between;align-items:flex-start}
.schm b{font-family:var(--font-display);font-size:var(--fs-h3);line-height:1.2}
.schm p{color:var(--fg-2);font-size:var(--fs-sm);line-height:1.35}
.match-pill{display:inline-flex;align-items:center;gap:6px;color:var(--leaf);font-weight:700;font-size:var(--fs-xs);margin-top:auto}
.match-pill .tick{width:18px;height:18px}
.match-pill .tick svg{width:11px;height:11px}
.pop{width:min(70vw,248px);text-align:left;display:block}
.pop .art{aspect-ratio:16/11;border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.pop-m{padding:8px 2px 0}
.pop-m .muted{display:flex;align-items:center;gap:6px;margin-top:2px}
.pop-m .muted svg{color:var(--gold)}
.wrow{display:flex;gap:12px;align-items:center;padding:12px;text-align:left;width:100%}
.wrow+.wrow{margin-top:10px}
.wrow .art{width:56px;height:56px;border-radius:var(--r-md)}
.wrow .art .art-i{width:80%;right:-12%;bottom:-14%;opacity:.5}
.wkm{text-align:right;flex:none;padding-left:4px}
.wkm b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.1;font-weight:800;color:var(--fg)}
.wkm small{color:var(--fg-3);font-size:var(--fs-micro);font-weight:600}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px}
.pay{font-weight:700;color:var(--fg);font-size:var(--fs-sm)}
.shg{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.cal{width:52px;height:56px;border-radius:var(--r-md);background:var(--surface-2);display:grid;place-items:center;text-align:center;line-height:1;flex:none;overflow:hidden;align-content:start;padding-top:0}
.cal small{display:block;width:100%;background:var(--accent);color:var(--accent-fg);font-size:10.5px;font-weight:700;padding:4px 0 3px;letter-spacing:.06em}
.cal b{font-family:var(--font-display);font-size:22px;padding-top:6px;color:var(--accent)}

/* notifications sheet */
.nlist{display:grid;gap:4px;padding-bottom:4px}
.nrow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;position:relative}
.nrow+.nrow{border-top:1px solid var(--border)}
.nrow p{font-size:var(--fs-body);line-height:1.4}
.nic{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.ndot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:8px;flex:none}

/* ---------- MY COURSES ---------- */
.pad{padding:0 16px}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 0;font-weight:600;color:var(--fg-2);font-size:var(--fs-sm)}
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin:16px 16px 4px;padding:4px;border-radius:var(--r-pill);background:var(--bg-2);isolation:isolate}
.seg button{min-height:44px;border-radius:var(--r-pill);font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.seg button::after{content:'';position:absolute;inset:-4px 0}
.seg button[aria-selected=true]{color:var(--accent)}
.seg-ind{position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-1);transform:translateX(calc(var(--i) * 100%));transition:transform var(--dur-slow) var(--ease-emphasized)}
.seg .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-fg);font-size:11.5px;font-weight:700;margin-left:6px;line-height:1}
.clist{padding:8px 16px 0;display:grid;gap:12px}
.crow{position:relative}
.crow-main{display:flex;align-items:center;gap:14px;padding:12px 8px 12px 12px;width:100%;text-align:left}
.crow .art{width:76px;height:76px;flex:none}
.crow .art-i{opacity:.5}
.crow h3{font-size:var(--fs-h3);line-height:1.25}
.crow .sub{margin-top:1px}
.cprog{display:flex;align-items:center;gap:10px;margin-top:10px}
.cprog .pbar{flex:1;height:6px}
.cprog span{font-size:var(--fs-xs);font-weight:700;color:var(--fg-2);min-width:34px;text-align:right}
.heart{position:absolute;left:4px;top:4px;width:48px;height:48px;display:grid;place-items:center;color:var(--cream)}
.heart span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--maroon-deep) 40%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.heart svg{transition:transform var(--dur-std) var(--ease-spring)}
.heart[aria-pressed=true] svg{fill:currentColor}
.heart[aria-pressed=true] span{background:var(--accent)}
.heart.pop svg{animation:hpop .42s var(--ease-spring)}
@keyframes hpop{40%{transform:scale(1.35)}}
.empty{padding:40px 24px;text-align:center;color:var(--fg-2);display:grid;justify-items:center;gap:12px}
.empty .ei{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}

/* ---------- COURSE DETAIL ---------- */
.cbar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px 6px;transition:background-color var(--dur-std),box-shadow var(--dur-std)}
.cbar-t{flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:var(--fs-h3);opacity:0;transform:translateY(6px);transition:opacity var(--dur-std),transform var(--dur-std) var(--ease-emphasized);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.solid .cbar{background:var(--bg);box-shadow:0 1px 0 var(--border)}
.solid .cbar-t{opacity:1;transform:none}
.solid .cbar .ib--glass{box-shadow:none;background:transparent;backdrop-filter:none}
.cbar .ib--glass[aria-pressed=true]{color:var(--accent)}
.cbar .ib--glass[aria-pressed=true] svg{fill:currentColor}
.chero{aspect-ratio:16/10;border-radius:0 0 var(--r-xl) var(--r-xl)}
.chero .art-i{width:46%;right:6%;bottom:6%;opacity:.42}
.chero::after{background:linear-gradient(to bottom,color-mix(in srgb,var(--maroon-deep) 35%,transparent),transparent 40%)}
.cd-head{padding:18px 16px 4px}
.cd-head h1{font-size:var(--fs-h1);font-weight:800}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mchips .chip{padding:3px 10px;gap:5px}
.mchips .chip svg{width:16px;height:16px}
.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:4;display:flex;gap:4px;padding:0 12px;margin-top:14px;background:var(--bg);box-shadow:0 1px 0 var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:var(--tap);padding:0 8px;font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);white-space:nowrap;position:relative;flex:1 0 auto}
.tabs button[aria-selected=true]{color:var(--accent)}
.tabs button[aria-selected=true]::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);animation:pill var(--dur-std) var(--ease-emphasized)}
.tabs button:active{transform:none}
.tabp{padding:18px 16px 28px;min-height:360px}
.tabp>.rise{--i:0}
.blurb{font-size:var(--fs-body);color:var(--fg);line-height:1.6}
.learn{margin-top:20px;padding:16px}
.learn h3,.tabp h3{font-size:var(--fs-h3);margin-bottom:10px}
.learn li{display:flex;gap:12px;align-items:flex-start;padding:7px 0;line-height:1.4}
.learn .tick{margin-top:1px}
.inst{display:flex;gap:14px;align-items:center;margin-top:20px}
.inst .av{width:52px;height:52px;font-size:22px}
.dlbtn{margin-top:20px}
.dlbar{height:52px;border-radius:var(--r-pill);background:var(--surface-2);position:relative;overflow:hidden;display:grid;place-items:center;font-weight:700;color:var(--accent)}
.dlbar i{position:absolute;inset:0;background:var(--accent-soft);transform-origin:left;transform:scaleX(var(--p));transition:transform 120ms linear}
.dlbar span{position:relative}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 0;min-height:68px}
.lrow+.lrow{border-top:1px solid var(--border)}
.lnum{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:15px;background:var(--surface-2);color:var(--fg-2);flex:none;padding-top:2px}
.lrow.is-done .lnum{background:var(--leaf-pale);color:var(--leaf)}
.lrow.is-cur .lnum{background:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.lrow.is-lock{opacity:.55}
.lrow .row-t{font-size:var(--fs-body)}
.lrow.is-cur .row-t{color:var(--accent)}
.lend{flex:none;color:var(--fg-3);display:flex;align-items:center}
.inv-intro{display:flex;gap:14px;align-items:center;padding:16px;margin-bottom:16px}
.inv-intro .ei{width:52px;height:52px;border-radius:var(--r-md);background:var(--surface-2);color:var(--accent);display:grid;place-items:center;flex:none}
.frow{display:flex;align-items:center;gap:14px;padding:10px 0}
.frow+.frow{border-top:1px solid var(--border)}
.frow .av{width:46px;height:46px;font-size:19px;position:relative}
.online{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 2.5px var(--bg)}
.addb{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);flex:none}
.addb.is-on{width:auto;padding:0 14px;background:var(--leaf-pale);color:var(--leaf);border-radius:var(--r-pill);gap:6px;display:inline-flex;align-items:center;font-weight:700;font-size:var(--fs-sm)}
.msg{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.msg .av{width:34px;height:34px;font-size:14px}
.bub{background:var(--surface);box-shadow:var(--sh-1);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 6px;padding:10px 14px;max-width:82%}
.bub b{display:block;font-size:var(--fs-xs);color:var(--accent);font-weight:700}
.bub p{line-height:1.45}
.bub small{color:var(--fg-3);font-size:var(--fs-micro)}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--accent);color:var(--accent-fg);border-radius:var(--r-lg) var(--r-lg) 6px var(--r-lg)}
.msg.me .bub small{color:inherit;opacity:.75}
.msg.inst-msg .bub{background:var(--gold-pale);box-shadow:none}
.compose{display:flex;gap:8px;align-items:center;margin-top:8px}
.compose input{flex:1;min-width:0;height:52px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface);padding:0 18px;outline:none;font-size:var(--fs-body)}
.compose input:focus{border-color:var(--accent);box-shadow:var(--focus)}
.compose .addb{width:52px;height:52px}

/* ---------- LESSON PLAYER ---------- */
.ldark{flex:none;position:relative;color:var(--cream);background:linear-gradient(165deg,var(--maroon-deep) 0%,var(--ink) 100%);isolation:isolate;padding-bottom:6px}
.ldark::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px 56px;opacity:.6;z-index:-1}
.lbar{display:flex;align-items:center;gap:4px;height:calc(56px + 8px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 8px 0}
.lbar .ib{color:var(--cream)}
.lbar .ib:active{background:color-mix(in srgb,var(--cream) 14%,transparent)}
.lbar-t{flex:1;min-width:0;text-align:center;font-weight:600;font-size:var(--fs-sm);opacity:.85}
.player{aspect-ratio:16/9;position:relative;overflow:hidden;margin:0 12px;border-radius:var(--r-md);background:radial-gradient(90% 120% at 70% 30%,color-mix(in srgb,var(--rose) 40%,transparent),transparent 70%),linear-gradient(135deg,var(--a0),var(--maroon-deep));box-shadow:0 12px 32px color-mix(in srgb,var(--ink) 60%,transparent);isolation:isolate}
.player::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px 56px;z-index:-1}
.player .pl-art{position:absolute;right:4%;top:6%;width:42%;height:auto;aspect-ratio:1;opacity:.24;z-index:-1}
.pl-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:28px;padding-bottom:50px}
.pl-big{width:72px;height:72px;border-radius:50%;background:var(--cream);color:var(--maroon);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 50%,transparent)}
.pl-sk{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;color:var(--cream);position:relative;background:color-mix(in srgb,var(--ink) 30%,transparent)}
.pl-sk b{position:absolute;font-size:9.5px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%)}
.pl-bot{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 6px;display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;background:linear-gradient(to top,color-mix(in srgb,var(--ink) 70%,transparent),transparent)}
.pl-bot .num{min-width:38px}
.scrub{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent;margin:0;cursor:pointer}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cream) calc(var(--p) * 100%),color-mix(in srgb,var(--cream) 30%,transparent) 0)}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--cream) calc(var(--p) * 100%),color-mix(in srgb,var(--cream) 30%,transparent) 0)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cream);margin-top:-6px;box-shadow:0 0 0 4px color-mix(in srgb,var(--cream) 25%,transparent)}
.scrub::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--cream)}
.subt{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:max-content;max-width:90%;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:color-mix(in srgb,var(--ink) 72%,transparent);padding:3px 10px;border-radius:6px;font-size:13px;line-height:1.35}
.lctl{display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none}
.lctl::-webkit-scrollbar{display:none}
.dchip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--cream) 12%,transparent);color:var(--cream);font-weight:600;font-size:var(--fs-sm);white-space:nowrap;position:relative;flex:none}
.dchip::after{content:'';position:absolute;inset:-4px 0}
.dchip[aria-pressed=true]{background:var(--cream);color:var(--maroon)}
.dchip.is-ok{background:color-mix(in srgb,var(--leaf) 40%,transparent)}
.ldone{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--ink) 78%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .3s ease both}
@keyframes fade{from{opacity:0}}
.okc{width:64px;height:64px;border-radius:50%;background:var(--leaf);color:var(--cream);display:grid;place-items:center;animation:overshoot .7s var(--ease-spring) both .1s;box-shadow:0 0 0 8px color-mix(in srgb,var(--leaf) 28%,transparent)}
.okc svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s ease-out forwards .45s}
@keyframes overshoot{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.ldone h2{font-size:var(--fs-h2);color:var(--cream)}
.ldone .btn{min-height:44px;font-size:15px;padding:0 18px;background:var(--cream);color:var(--maroon);box-shadow:none}
.lhead{padding:18px 16px 0}
.lhead h1{font-size:var(--fs-h1);font-weight:800;margin-top:2px}
.todo{margin:18px 16px 0;padding:6px 16px}
.todo h3{font-size:var(--fs-h3);padding:12px 0 4px}
.trow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:56px;padding:6px 0}
.trow+.trow{border-top:1px solid var(--border)}
.tbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--border);display:grid;place-items:center;color:transparent;flex:none;transition:all var(--dur-std) var(--ease-spring)}
.trow[aria-pressed=true] .tbox{background:var(--leaf);border-color:var(--leaf);color:var(--cream);transform:scale(1.05)}
.trow[aria-pressed=true] .row-t{color:var(--fg-2);text-decoration:line-through;text-decoration-color:var(--fg-3)}
.trow .step{font-family:var(--font-display);font-weight:700;color:var(--fg-3);font-size:var(--fs-sm)}
.unext{display:flex;align-items:center;gap:14px;padding:12px;margin:12px 16px 24px;text-align:left;width:calc(100% - 32px)}
.unext .art{width:64px;height:64px}

/* ---------- CERTIFICATE ---------- */
.certc{background:var(--paper);border-radius:var(--r-md);padding:10px;box-shadow:var(--sh-2);position:relative;overflow:hidden;animation:overshoot .8s var(--ease-spring) both .1s;margin-top:8px}
.cert-in{border:2px solid var(--accent);outline:1px solid var(--accent);outline-offset:-7px;border-radius:10px;padding:22px 18px 18px;text-align:center;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(100% 60% at 50% 0%,var(--gold-pale),transparent 70%)}
.cert-wm{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-8deg);font-size:120px;color:transparent;-webkit-text-stroke:1.5px var(--accent);z-index:-1;opacity:.16!important;white-space:nowrap}
.cert-logo{font-size:30px;color:var(--accent);line-height:1.2}
.cert-latin{font-size:var(--fs-micro);letter-spacing:.3em;color:var(--fg-3);font-weight:700;text-transform:uppercase;margin-top:-4px}
.cert-t{font-family:var(--font-display);font-weight:700;font-size:var(--fs-h3);color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-top:14px;line-height:1.3}
html[lang=hi] .cert-t{letter-spacing:0;font-size:20px}
.cert-rule{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--gold);margin:6px 0 10px}
.cert-rule i{height:1px;width:48px;background:currentColor}
.cert-cap{color:var(--fg-2);font-size:var(--fs-sm);font-style:italic}
html[lang=hi] .cert-cap{font-style:normal}
.cert-name{font-size:34px;font-weight:800;color:var(--fg);margin:2px 0 4px;line-height:1.25}
.cert-course{font-size:var(--fs-h2);color:var(--accent);margin-top:4px;line-height:1.3}
.cert-foot{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:end;margin-top:18px;text-align:left}
.cert-foot dl{margin:0;display:grid;gap:6px}
.cert-foot dt{font-size:var(--fs-micro);color:var(--fg-3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
html[lang=hi] .cert-foot dt{letter-spacing:0;text-transform:none}
.cert-foot dd{margin:0;font-weight:700;font-size:var(--fs-sm);line-height:1.25}
.seal{width:62px;height:76px}
.qr{width:58px;height:58px;color:var(--fg);background:var(--paper);padding:3px;border-radius:4px}
.verified{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--leaf);font-weight:700;font-size:var(--fs-sm);margin:16px 0 18px}
.cert-act{display:grid;gap:10px;padding-bottom:28px}
.wa{background:var(--leaf);color:var(--leaf-pale);box-shadow:0 6px 16px color-mix(in srgb,var(--leaf) 30%,transparent)}

/* ---------- SCHEMES ---------- */
.prof{padding:16px;margin-top:4px;overflow:hidden}
.prof::before{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--surface-2)}
.prof-top{display:flex;align-items:center;gap:12px;position:relative}
.prof-top .av{width:52px;height:52px;font-size:22px}
.prof-top h2{font-size:var(--fs-h2)}
.edit{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 14px;border-radius:var(--r-pill);color:var(--accent);font-weight:700;font-size:var(--fs-sm);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent-soft);flex:none}
.pgrid{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:8px;margin:16px 0 14px;position:relative}
.pgrid dt{font-size:var(--fs-micro);color:var(--fg-3);font-weight:600}
.pgrid dd{margin:0;font-weight:700;font-size:var(--fs-sm);line-height:1.3}
.slist{padding:12px 16px 0;display:grid;gap:12px}
.srow{display:flex;gap:14px;align-items:flex-start;padding:14px 10px 14px 14px;text-align:left;width:100%}
.srow h3{font-size:var(--fs-h3);line-height:1.3}
.srow .sub{margin-top:2px}
.srow .wmeta{margin-top:10px}
.srow .chev{align-self:center}
.chips-row{padding:12px 16px 0;display:flex;gap:8px;flex-wrap:wrap}
/* scheme detail */
.sd-head{padding:8px 16px 0;display:grid;gap:10px;justify-items:start}
.sd-head h1{font-size:var(--fs-h1);font-weight:800}
.sd-head .sub{font-size:var(--fs-body)}
.listen{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;margin:18px 16px 0;width:calc(100% - 32px);text-align:left}
.lbtn{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.listen[aria-pressed=true] .lbtn{animation:pulse 1.2s ease-out infinite}
.listen .pbar{height:6px;margin-top:8px}
.listen .pbar i{animation:none;transition:transform 100ms linear}
.wave{display:flex;gap:3px;align-items:center;height:22px;flex:none}
.wave i{width:3px;border-radius:2px;background:var(--accent-soft);height:30%}
.listen[aria-pressed=true] .wave i{background:var(--accent);animation:lb .6s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s!important;height:70%}.wave i:nth-child(3){animation-delay:.25s!important;height:45%}.wave i:nth-child(4){animation-delay:.4s!important;height:85%}.wave i:nth-child(5){animation-delay:.15s!important;height:55%}
.sd-sec{padding:24px 16px 0}
.sd-sec h2{font-size:var(--fs-h3);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px 4px 6px;border-radius:var(--r-pill);background:var(--leaf-pale);color:var(--leaf);font-weight:700;font-size:var(--fs-sm)}
.benefit{padding:16px;display:flex;gap:14px;align-items:flex-start;background:var(--gold-pale);box-shadow:none}
.benefit .nic{background:var(--gold);color:var(--paper);width:40px;height:40px}
.benefit p{line-height:1.55}
.docs{padding:2px 16px}
.drow{display:flex;align-items:center;gap:12px;min-height:64px}
.drow+.drow{border-top:1px solid var(--border)}
.dtog{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:var(--r-pill);font-weight:700;font-size:var(--fs-xs);box-shadow:inset 0 0 0 1.5px var(--border);color:var(--fg-2);flex:none;position:relative}
.dtog::after{content:'';position:absolute;inset:-4px 0}
.dtog .tbox{width:20px;height:20px;border-radius:6px}
.dtog[aria-pressed=true]{background:var(--leaf-pale);color:var(--leaf);box-shadow:none}
.dtog[aria-pressed=true] .tbox{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-pale)}
.steps{position:relative;display:grid;gap:0}
.steps li{display:flex;gap:14px;position:relative;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:'';position:absolute;left:17px;top:36px;bottom:2px;width:2px;background:var(--border)}
.steps li:last-child::before{display:none}
.steps b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);flex:none;padding-top:2px}
.steps li:first-child b{background:var(--accent);color:var(--accent-fg)}
.steps p{padding-top:6px;line-height:1.45}
.near{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}
.near .nic{background:var(--sky-pale);color:var(--sky)}
.foot .btn--ghost{min-height:var(--tap);font-size:15.5px}

/* ---------- WORK ---------- */
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.wk-h h2{font-size:var(--fs-h1);font-weight:800}
.fbtn{background:var(--surface);box-shadow:var(--sh-1);color:var(--accent)}
.fbtn .dot{background:var(--accent);box-shadow:0 0 0 2px var(--surface);top:10px;right:10px}
.skillbar{margin:12px 16px 0;padding:10px 6px 10px 14px;display:flex;align-items:center;gap:10px;background:var(--gold-pale);box-shadow:none;border-radius:var(--r-md)}
.skillbar p{flex:1;font-weight:600;font-size:var(--fs-sm)}
.wchips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.wchips::-webkit-scrollbar{display:none}
.wchips .chip{flex:none}
.jlist{padding:14px 16px 0;display:grid;gap:16px}
.job{overflow:hidden}
.job-main{display:block;width:100%;text-align:left}
.job .art{aspect-ratio:16/9;border-radius:var(--r-lg) var(--r-lg) 0 0}
.job .art-t{font-size:var(--fs-h2);left:16px;bottom:14px;right:90px}
.job .art-i{width:38%;right:4%;bottom:auto;top:8%;opacity:.3}
.kmb{position:absolute;right:12px;bottom:12px;background:color-mix(in srgb,var(--paper) 92%,transparent);color:var(--ink);border-radius:var(--r-md);padding:6px 10px 4px;text-align:center;line-height:1;backdrop-filter:blur(6px)}
.kmb b{display:block;font-family:var(--font-display);font-size:22px;font-weight:800}
.kmb small{font-size:11px;font-weight:700;color:var(--ink-2)}
.newb{position:absolute;left:12px;top:12px;min-height:26px;padding:2px 10px;background:var(--leaf);color:var(--leaf-pale)}
.job-b{padding:14px 16px 0}
.job-b h3{font-size:var(--fs-h3)}
.jmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--fg-2);font-size:var(--fs-sm)}
.jmeta span{display:inline-flex;align-items:center;gap:5px}
.jmeta svg{color:var(--fg-3)}
.jmeta .pay svg{color:var(--leaf)}
.job-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 16px;flex-wrap:wrap}
.need{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.frc{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-xs);font-weight:600;color:var(--fg-2);min-width:0}
.appl{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 16px;border-radius:var(--r-pill);background:var(--leaf-pale);color:var(--leaf);font-weight:700;font-size:15px}
/* job detail */
.jhero{aspect-ratio:16/9;border-radius:0 0 var(--r-xl) var(--r-xl)}
.jhero .art-i{width:40%;right:6%;bottom:8%;opacity:.4}
.jhero::after{background:linear-gradient(to bottom,color-mix(in srgb,var(--maroon-deep) 35%,transparent),transparent 45%)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 16px 0}
.tile{padding:14px;display:grid;gap:6px;align-content:start}
.tile .nic{width:36px;height:36px;border-radius:10px}
.tile dt{font-size:var(--fs-xs);color:var(--fg-3);font-weight:600}
.tile dd{margin:0;font-weight:700;line-height:1.3;font-size:var(--fs-sm)}
.tile dd.big{font-family:var(--font-display);font-size:26px;line-height:1.05;font-weight:800}
.tile dd.big small{font-size:14px;font-family:var(--font-body);color:var(--fg-2);margin-left:3px}
.frlist{display:flex;gap:18px;flex-wrap:wrap}
.frlist div{display:grid;justify-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600}
.frlist .av{width:52px;height:52px;font-size:20px}
.bul li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;line-height:1.45}
.bul li::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--rose);transform:rotate(45deg);margin:9px 4px 0;flex:none}
/* apply sheet */
.jmini{display:flex;gap:12px;align-items:center;padding:4px 0 14px}
.jmini .art{width:52px;height:52px}
.afnote{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--leaf-pale);color:var(--leaf);font-weight:600;font-size:var(--fs-sm);line-height:1.4}
.af{margin:8px 0 4px}
.af>div{display:flex;gap:14px;padding:12px 0;align-items:flex-start}
.af>div+div{border-top:1px solid var(--border)}
.af dt{width:96px;flex:none;color:var(--fg-3);font-size:var(--fs-sm);font-weight:600;padding-top:2px}
.af dd{margin:0;flex:1;min-width:0;font-weight:600;display:flex;flex-wrap:wrap;gap:6px}
.af dd .ok{color:var(--leaf);margin-left:auto}
/* success */
.succ{flex:1;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(48px + env(safe-area-inset-top)) 20px 24px;position:relative;isolation:isolate}
.succ::before{content:'';position:absolute;left:-20%;right:-20%;top:-30%;height:70%;background:radial-gradient(closest-side,var(--leaf-pale),transparent);z-index:-1}
.succ .close{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top))}
.bigok{width:112px;height:112px;border-radius:50%;background:var(--leaf);color:var(--leaf-pale);display:grid;place-items:center;position:relative;animation:overshoot .8s var(--ease-spring) both .15s}
.bigok::before,.bigok::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid var(--leaf);animation:ripple 1.6s var(--ease-arrive) both .5s}
.bigok::after{animation-delay:.8s}
@keyframes ripple{from{transform:scale(1);opacity:.6}to{transform:scale(1.9);opacity:0}}
.bigok svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s ease-out forwards .6s}
.succ h1{font-size:var(--fs-hero);font-weight:800;margin-top:28px}
.succ>p{max-width:30ch;color:var(--fg-2);margin-top:8px;font-size:17px}
.succ>p b{color:var(--fg)}
.callcard{display:flex;gap:12px;align-items:center;padding:14px 16px;margin-top:22px;text-align:left;width:100%}
.callcard .nic{background:var(--sky-pale);color:var(--sky)}
.xmore{width:100%;text-align:left;margin-top:26px}
.xmore h2{font-size:var(--fs-h3);margin-bottom:10px}
.xmore .hs{margin:0 -20px;padding:4px 20px 8px;scroll-padding:0 20px}
.xcard{width:min(64vw,230px);text-align:left;overflow:hidden;display:block}
.xcard .art{aspect-ratio:16/9;border-radius:var(--r-lg) var(--r-lg) 0 0}
.xcard .art-t{font-size:15px}
.xcard div.xb{padding:10px 12px 12px}

/* ---------- PROFILE ---------- */
.prof-band{padding:calc(6px + env(safe-area-inset-top)) 16px 64px;text-align:center;border-radius:0 0 var(--r-xl) var(--r-xl)}
.prof-band .wm-bleed{font-size:136px;left:-36px;bottom:-62px}
.prof-band .band-row{margin:0 -8px}
.bigav{width:96px;height:96px;font-size:40px;margin:4px auto 0;display:grid}
.prof-band h1{font-size:var(--fs-h1);font-weight:800;margin-top:12px}
.prof-band .num{opacity:.82;font-size:var(--fs-sm);margin-top:2px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);margin:-40px 16px 0;padding:14px 4px;position:relative;z-index:1;box-shadow:var(--sh-2)}
.pstats div{text-align:center;padding:0 6px;display:grid;justify-items:center;gap:2px}
.pstats div+div{border-left:1px solid var(--border)}
.pstats b{font-family:var(--font-display);font-size:24px;font-weight:800;line-height:1.15}
.pstats small{font-size:var(--fs-xs);color:var(--fg-2);line-height:1.25}
.chart{padding:16px}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.chart-h b{font-family:var(--font-display);font-size:var(--fs-h2)}
.bars{position:relative;height:132px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;padding-top:22px;margin-right:22px}
.bars .goal{position:absolute;left:0;right:-22px;top:22px;border-top:1.5px dashed var(--border)}
.bars .goal span{position:absolute;right:0;top:-9px;font-size:11px;color:var(--fg-3);font-weight:700;background:var(--surface);padding-left:4px}
.bars>div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.bars i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--accent-soft);height:var(--h);transform-origin:bottom;animation:grow .9s var(--ease-arrive) both;animation-delay:calc(var(--k) * 60ms + .15s);min-height:4px}
.bars .today i{background:var(--accent)}
.bars .future i{opacity:.3;background:var(--border)}
.bars .today em{position:absolute;bottom:calc(var(--h) + 4px);font-style:normal;font-size:12px;font-weight:700;color:var(--accent)}
@keyframes grow{from{transform:scaleY(0)}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:8px 22px 0 0;text-align:center;font-size:var(--fs-xs);color:var(--fg-3);font-weight:600}
.days .today{color:var(--accent);font-weight:800}
.skills{display:flex;flex-wrap:wrap;gap:8px}
.skills .chip{min-height:40px;font-size:var(--fs-sm);padding:4px 16px 4px 6px;background:var(--surface);box-shadow:var(--sh-1);color:var(--fg)}
.skills .chip .nic{width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--accent)}
.plist{padding:4px 16px}
.plist .row{gap:14px}
.plist .nic{width:42px;height:42px;background:var(--surface-2);color:var(--accent);border-radius:var(--r-sm)}
.plist .row-b .muted{font-size:var(--fs-xs);line-height:1.35;margin-top:1px}
.plist .row.danger .nic{background:var(--alert-pale);color:var(--alert)}
.plist .row.danger .row-t{color:var(--alert)}
.lsheet{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:6px}

/* ---------- ONBOARDING ---------- */
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;text-align:center;cursor:pointer;color:var(--on-band)}

.resend{display:flex;justify-content:center;font-size:var(--fs-sm);color:var(--fg-3);font-weight:600;min-height:var(--tap);align-items:center}
.why{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--sky-pale);box-shadow:none;color:var(--sky);font-weight:600;font-size:var(--fs-sm);line-height:1.45;border-radius:var(--r-md)}

function go(name, p = {}, o = {}) {

  sh.addEventListener('pointerdown', start); sh.addEventListener('pointermove', move); sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);

/* edge-swipe back */
(() => {
  let sx = null, sy = 0, dx = 0, cur = null, under = null, locked = false;
  stage.addEventListener('touchstart', e => {
    const tch = e.touches[0];
    if (S.stack.length < 2 || $('#sheets').classList.contains('open')) return;
    const r = stage.getBoundingClientRect();
    if (tch.clientX - r.left > 24) return;
    sx = tch.clientX; sy = tch.clientY; dx = 0; locked = false;
    cur = topE(); under = S.stack[S.stack.length - 2];
  }, { passive: true });
  stage.addEventListener('touchmove', e => {
    if (sx == null) return;
    const tch = e.touches[0];
    dx = Math.max(0, tch.clientX - sx);
    if (!locked) { if (Math.abs(tch.clientY - sy) > 12 && dx < 12) { sx = null; return; } if (dx < 6) return; locked = true; under.el.style.visibility = ''; }
    const w = stage.offsetWidth;
    cur.el.style.transform = `translateX(${dx}px)`;
    cur.el.style.boxShadow = 'var(--sh-3)';
    under.el.style.transform = `translateX(${-28 + 28 * dx / w}%)`;
  }, { passive: true });
  const end = () => {
    if (sx == null) return;
    sx = null;
    if (!locked) return;
    const w = stage.offsetWidth, c = cur, u = under;
    if (dx > w * .35) {
      const a = anim(c.el, [{ transform: `translateX(${dx}px)` }, { transform: 'translateX(100%)' }], 260, 'ease-out');
      anim(u.el, [{ transform: u.el.style.transform }, { transform: 'none' }], 260, 'ease-out');
      a.finished.then(() => { u.el.getAnimations().forEach(x => x.cancel()); u.el.style.transform = ''; S.noAnimNext = true; if (history.state?.z === S.stack.length - 1) history.back(); else _pop(true); });
    } else {
      const a = anim(c.el, [{ transform: `translateX(${dx}px)` }, { transform: 'none' }], 260, 'ease-out');
      anim(u.el, [{ transform: u.el.style.transform }, { transform: 'translateX(-28%)' }], 260, 'ease-out');
      a.finished.then(() => { c.el.getAnimations().forEach(x => x.cancel()); u.el.getAnimations().forEach(x => x.cancel()); c.el.style.transform = ''; c.el.style.boxShadow = ''; u.el.style.transform = ''; u.el.style.visibility = 'hidden'; });
    }
  };
  stage.addEventListener('touchend', end); stage.addEventListener('touchcancel', end);
})();

function sealSVG() {

}
function qrSVG(seed) {
  let x = 0; for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296;
  const N = 21, finder = (r, c) => [[0, 0], [0, 14], [14, 0]].some(([a, b]) => r >= a && r < a + 7 && c >= b && c < b + 7);
  let d = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!finder(r, c) && rnd() > .52) d += `M${c} ${r}h1v1h-1z`;
  const f = (a, b) => `M${b} ${a}h7v7h-7zM${b + 1} ${a + 1}v5h5v-5zM${b + 2} ${a + 2}h3v3h-3z`;
  return `<svg class="qr" viewBox="0 0 21 21" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="${d}${f(0, 0)}${f(0, 14)}${f(14, 0)}"/></svg>`;
}

    const other = ZARIYA.i18n.chooseLanguage[LANG === 'en' ? 'hi' : 'en'];
    return `<div class="scroll"><div class="ob-h"><p class="wordmark ob-logo">${WM}</p><h1>${t('chooseLanguage')}</h1><p class="alt" lang="${LANG === 'en' ? 'hi' : 'en'}">${esc(other)}</p><p class="sub" style="margin-top:8px">${t('langNote')}</p></div>
      <div class="lgrid">${langCards(S.pickLang ?? LANG)}</div></div>
      <div class="foot"><button class="btn btn--block" data-a="go" data-s="onb">${t('next')}${ic('chev', 20, 2.4)}</button></div>`;
  },
};

/* ---- ONBOARDING: CAROUSEL ---- */
const OBART = [
  ['#8C2F3F', '#C4616F', `<g fill="none" stroke="var(--cream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="150" width="172" height="16" rx="8" fill="color-mix(in srgb,var(--cream) 18%,transparent)"/><path d="M184 150V74a16 16 0 0 0-16-16H80a16 16 0 0 0-16 16v36h22V88h76v62" fill="color-mix(in srgb,var(--cream) 14%,transparent)"/><circle cx="186" cy="92" r="17"/><circle cx="186" cy="92" r="5"/><path d="M75 110v24M64 134h22"/><rect x="112" y="34" width="14" height="24" rx="3"/><path d="M119 34c0-14-36-10-44 24"/><path d="M38 141c18-7 34-7 52 0s34 7 52 0" stroke-dasharray="1 9"/></g>`],
  ['#4E7D5B', '#8DB89A', `<g fill="none" stroke="var(--cream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M62 30h76l26 26v110H62z" fill="color-mix(in srgb,var(--cream) 16%,transparent)"/><path d="M138 30v26h26M82 72h48M82 92h62M82 112h36"/><circle cx="58" cy="152" r="20" fill="color-mix(in srgb,var(--cream) 20%,transparent)"/><path d="M50 143h16M50 150h16M50 143h5a6 6 0 0 1 0 12h-5l10 9"/><circle cx="168" cy="146" r="30" fill="var(--leaf)"/><path d="M154 146l10 10 18-20" stroke-width="6"/></g>`],
  ['#3F6E8C', '#7FA9C4', `<g fill="none" stroke="var(--cream)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 166h192"/><path d="M50 166v-52l38-30 38 30v52" fill="color-mix(in srgb,var(--cream) 16%,transparent)"/><path d="M78 166v-28h20v28M40 122l48-38 48 38"/><path d="M92 182c30 10 66 0 82-34" stroke-dasharray="2 10"/><path d="M176 132c-16-18-24-30-24-42a24 24 0 0 1 48 0c0 12-8 24-24 42z" fill="var(--maroon)"/><circle cx="176" cy="90" r="8" fill="var(--cream)"/><path d="M196 166v-22M196 144c-8 0-12-6-12-12 6 0 12 4 12 12zM196 144c8 0 12-6 12-12-6 0-12 4-12 12z"/></g>`],
];
SC.onb = {
  render(p, entry) {
    entry.i ??= 0;
    return `<button class="ob-skip" data-a="go" data-s="phone">${t('skipIntro')}</button>
      <div class="ob-track">${OBART.map(([a0, a1, svg], i) => `<section class="ob-slide" aria-roledescription="slide" aria-label="${i + 1}/3"><div class="ob-art" style="--a0:${a0};--a1:${a1}"><svg viewBox="0 0 240 200" aria-hidden="true">${svg}</svg></div><h1>${t('onb' + (i + 1) + 't')}</h1><p>${t('onb' + (i + 1) + 'b')}</p></section>`).join('')}</div>
      <div class="foot ob-foot"><span class="dots" aria-hidden="true">${[0, 1, 2].map(i => `<i class="${i === entry.i ? 'on' : ''}"></i>`).join('')}</span><button class="btn" data-a="obNext" style="min-width:150px">${entry.i === 2 ? t('getStarted') : t('next')}${ic('chev', 20, 2.4)}</button></div>`;
  },
  mount(el, p, entry) {
    const tr = $('.ob-track', el);
    requestAnimationFrame(() => { tr.scrollLeft = entry.i * tr.clientWidth; });
    tr.addEventListener('scroll', () => {
      const i = Math.round(tr.scrollLeft / tr.clientWidth);
      if (i === entry.i) return;
      entry.i = i;
      $$('.dots i', el).forEach((d, k) => d.classList.toggle('on', k === i));
      $('[data-a=obNext]', el).innerHTML = (i === 2 ? t('getStarted') : t('next')) + ic('chev', 20, 2.4);
    }, { passive: true });
  },
};
A.obNext = () => { const e = topE(), tr = $('.ob-track', e.el); buzz(); if (e.i >= 2) return go('phone'); tr.scrollTo({ left: (e.i + 1) * tr.clientWidth, behavior: RM.matches ? 'auto' : 'smooth' }); };

/* ---- ONBOARDING: PHONE + OTP ---- */
const obBar = () => `<header class="bar">${backBtn()}<span class="bar-t"></span><div class="bar-r">${langChip()}</div></header>`;
SC.phone = {
  render(p, entry) {
    entry.ph ??= '70807 81003';
    return `${obBar()}<div class="scroll"><form class="ob-form" data-form="phone" novalidate><p class="eyebrow" style="color:var(--accent)">${t('stepOf', { n: 1, m: 3 })}</p><h1>${t('phoneTitle')}</h1><p class="sub">${t('phoneSub')}</p>
      <label class="field"><span>${t('phoneLabel')}</span><span class="phin"><span class="cc num">+91</span><input name="ph" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="11" value="${esc(entry.ph)}" aria-label="${t('phoneLabel')}"></span></label>
      <button class="btn btn--block" type="submit">${t('sendOtp')}${ic('chev', 20, 2.4)}</button>
      <div class="or"><i></i>${t('or')}<i></i></div>
      <button class="btn btn--line btn--block" type="button" data-a="google"><span class="gmark" aria-hidden="true">G</span>${t('google')}</button>
      <p class="help">${ic('shield', 20, 2)}<span>${t('otpHelp')}</span></p></form></div>`;
  },
  mount(el, p, entry) {
    const inp = $('[name=ph]', el);
    inp.addEventListener('input', () => { const d = inp.value.replace(/\D/g, '').slice(0, 10); inp.value = d.length > 5 ? d.slice(0, 5) + ' ' + d.slice(5) : d; entry.ph = inp.value; });
  },
};
FORMS.phone = f => {
  const d = f.ph.value.replace(/\D/g, '');
  if (d.length !== 10) { toast(t('phoneWrong'), false); anim($('.phin', f), [{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 300, 'ease'); return; }
  go('otp', { ph: '+91 ' + d.slice(0, 5) + ' ' + d.slice(5) });
};
A.google = () => { buzz(); go('info'); };
SC.otp = {
  render(p, entry) {
    entry.left ??= 30;
    return `${obBar()}<div class="scroll"><form class="ob-form" data-form="otp" novalidate><p class="eyebrow" style="color:var(--accent)">${t('stepOf', { n: 2, m: 3 })}</p><h1>${t('otpTitle')}</h1><p class="sub">${t('enterOtp')} <b class="num" style="color:var(--fg)">${esc(p.ph || ZU.phone)}</b></p>
      <div class="otp" role="group" aria-label="${t('otpTitle')}">${[0, 1, 2, 3].map(i => `<input inputmode="numeric" maxlength="1" ${i === 0 ? 'autocomplete="one-time-code"' : ''} aria-label="${i + 1}" class="num">`).join('')}</div>
      <button class="btn btn--block" type="submit">${t('verify')}</button>
      <div class="resend" aria-live="polite">${entry.left > 0 ? `<span class="num">${t('resendIn', { n: entry.left })}</span>` : `<button type="button" class="link" data-a="resend">${t('resend')}</button>`}</div>
      <p class="help">${ic('shield', 20, 2)}<span>${t('otpHelp')}</span></p></form></div>`;
  },
  mount(el, p, entry) {
    const ins = $$('.otp input', el);
    ins.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(-1);
        inp.classList.toggle('f', !!inp.value);
        if (inp.value && ins[i + 1]) ins[i + 1].focus();
        if (ins.every(x => x.value)) setTimeout(() => FORMS.otp($('form', el)), 260);
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) { ins[i - 1].value = ''; ins[i - 1].classList.remove('f'); ins[i - 1].focus(); } });
    });
    clearInterval(entry.tm);
    entry.tm = setInterval(() => { entry.left = Math.max(0, entry.left - 1); const r = $('.resend', el); if (r) r.innerHTML = entry.left > 0 ? `<span class="num">${t('resendIn', { n: entry.left })}</span>` : `<button type="button" class="link" data-a="resend">${t('resend')}</button>`; if (!entry.left) clearInterval(entry.tm); }, 1000);
    setTimeout(() => { if (topE()?.el === el) ins[0].focus({ preventScroll: true }); }, 600);
  },
  leave(entry) { clearInterval(entry.tm); },
};
FORMS.otp = f => {
  const e = topE(); if (e.name !== 'otp' || e.busy) return;
  const ins = $$('.otp input', f);
  if (!ins.every(x => x.value)) { const g = $('.otp', f); g.classList.remove('err'); void g.offsetWidth; g.classList.add('err'); toast(t('otpWrong'), false); return; }
  e.busy = true; $('button[type=submit]', f).textContent = t('verifying');
  setTimeout(() => { e.busy = false; if (topE() === e) go('info'); }, 500);
};
A.resend = () => { const e = topE(); e.left = 30; buzz(); toast(t('sendOtp')); SC.otp.mount(e.el, e.p, e); };

/* ---- ONBOARDING: PERSONAL INFO (also profile edit) ---- */
SC.info = {
  render(p) {
    const edit = !!p.edit;
    return `${edit ? topbar(t('yourProfile'), { back: true }) : obBar()}<div class="scroll"><form class="ob-form" data-form="info" novalidate id="infoForm">
      ${edit ? '' : `<p class="eyebrow" style="color:var(--accent)">${t('stepOf', { n: 3, m: 3 })}</p>`}<h1>${t('tellUs')}</h1>
      <p class="why">${ic('info', 20, 2)}<span>${t('tellUsWhy')}</span></p>
      <label class="field"><span>${t('yourName')}</span><input class="inp" name="nm" value="${esc(userName())}" autocomplete="given-name"></label>
      <label class="field"><span>${t('stateL')}</span><select class="inp" name="st">${STATES.map(s => `<option value="${s.id}" ${S.state === s.id ? 'selected' : ''}>${esc(L(s.n))}</option>`).join('')}</select></label>
      <div class="field" role="group" aria-label="${t('cardType')}"><span>${t('cardType')}</span><div class="cardseg">${['AAY', 'BPL', 'APL', 'none'].map(k => `<button type="button" data-a="card" data-s="${k}" aria-pressed="${S.card === k}">${k === 'none' ? t('none') : k}</button>`).join('')}</div></div>
      <label class="field"><span>${t('dob')}</span><input class="inp num" type="date" name="dob" value="${S.dob}" max="2010-12-31"></label>
      </form></div>
      <div class="foot"><button class="btn btn--block" type="submit" form="infoForm">${edit ? t('saveL') : t('finish')}${edit ? '' : ic('chev', 20, 2.4)}</button></div>`;
  },
};
A.card = b => { S.card = b.dataset.s; buzz(); $$('[data-a=card]', topE().el).forEach(x => x.setAttribute('aria-pressed', x === b)); };
FORMS.info = f => {
  const nm = f.nm.value.trim();
  S.name = nm && nm !== L(ZU.name) && nm !== ZU.name.en && nm !== ZU.name.hi ? nm : null;
  S.state = f.st.value; S.dob = f.dob.value || S.dob;
  if (topE().p.edit) { back(); toast(t('profileSaved')); return; }
  store.set('zariya_onboarded', '1'); buzz();
  S.homeLoaded = false;
  resetTo('home', {}, { push: true });
};

FORMS.msg = f => {
  const v = f.m.value.trim(); if (!v) return;
  S.thread.push(v); buzz();
  const e = topE(); $('.tabp', e.el).innerHTML = courseTab(C(e.p.id), e); $('.tabp .rise', e.el)?.classList.remove('rise');
  const sc = $('.scroll', e.el); sc.scrollTop = sc.scrollHeight; $('.compose input', e.el)?.focus();
};
/*@SCREENS-END*/
/* ---------- boot ---------- */
(function boot() {
  const l = store.get('zariya_lang'); if (l === 'hi' || l === 'en') { LANG = l; document.documentElement.lang = l; }
  const th = store.get('zariya_theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  if (store.get('zariya_big') === '1') { S.big = true; document.documentElement.classList.add('big'); }
  history.replaceState({ z: 0 }, '');
  S.stack = [];
  const first = SC.splash ? 'splash' : 'home';
  const entry = { name: first, p: {} }; S.stack.push(entry); build(entry); stage.appendChild(entry.el); syncChrome();
})();
window.Z = { go, back, setLang, setTab, resetTo, openNotifs, openSheet, closeSheet, toast, S, top: () => topE()?.name,
  theme: m => { if (m) document.documentElement.dataset.theme = m; else delete document.documentElement.dataset.theme; repaintAll(); } };
</script>
</body>
</html>
