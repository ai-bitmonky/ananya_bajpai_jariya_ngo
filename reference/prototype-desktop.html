<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7B1E2E">
<title>Zariya Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ZARIYA ज़रिया — design tokens (single source of truth; inline into every HTML file)
   Layout concept: warm cream canvas, maroon as the ONE bold colour, blush for soft surfaces,
   outlined Devanagari wordmark as motif. No pure black, no pure white, no mid-grey. */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap');

:root{
  /* brand */
  --maroon:#7B1E2E;        /* primary – buttons, active tab, wordmark */
  --maroon-deep:#5E1423;   /* pressed, dark gradients */
  --maroon-soft:#9A3A49;   /* hover, secondary emphasis */
  --blush:#E9CCCF;         /* soft surfaces, chips */
  --blush-pale:#F6E6E7;    /* tints, selected rows */
  --rose:#C4616F;          /* progress fills on light surfaces */
  --cream:#FBF4EE;         /* page background */
  --cream-deep:#F3E8DF;    /* sunken areas, inputs */
  --paper:#FFFBF8;         /* cards (never #fff) */
  --ink:#2B1A1D;           /* primary text (maroon-biased near-black) */
  --ink-2:#5C4A4D;         /* secondary text */
  --ink-3:#8E7B7E;         /* tertiary / placeholders */
  --line:#E6D6D2;          /* hairlines */
  --gold:#C99A3C;          /* certificate, stars, "for me" match */
  --gold-pale:#F5E7C6;
  --leaf:#4E7D5B;          /* success / eligible */
  --leaf-pale:#DDEBE0;
  --sky:#3F6E8C;           /* info / links inside content */
  --sky-pale:#DCE8F0;
  --alert:#B4432F;         /* urgency ("5 seats left") */
  --alert-pale:#F6DCD6;

  /* semantic aliases (components use these) */
  --bg:var(--cream);
  --bg-2:var(--cream-deep);
  --surface:var(--paper);
  --surface-2:var(--blush-pale);
  --fg:var(--ink);
  --fg-2:var(--ink-2);
  --fg-3:var(--ink-3);
  --accent:var(--maroon);
  --accent-fg:#FFF6F3;
  --accent-soft:var(--blush);
  --border:var(--line);
  --focus:0 0 0 3px rgba(123,30,46,.28);

  /* type */
  --font-display:'Baloo 2','Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Mukta','Baloo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs-hero:34px;  --fs-h1:26px; --fs-h2:20px; --fs-h3:17px;
  --fs-body:16px;  --fs-sm:14px; --fs-xs:12.5px; --fs-micro:11px;
  --lh-tight:1.15; --lh-body:1.5;

  /* shape */
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-pill:999px;

  /* elevation (maroon-tinted, never grey) */
  --sh-1:0 1px 2px rgba(94,20,35,.06), 0 1px 3px rgba(94,20,35,.05);
  --sh-2:0 6px 18px rgba(94,20,35,.10), 0 1px 3px rgba(94,20,35,.06);
  --sh-3:0 18px 48px rgba(94,20,35,.18);
  --sh-up:0 -8px 24px rgba(94,20,35,.10);

  /* motion */
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --ease-emphasized:cubic-bezier(.2,0,0,1);
  --ease-arrive:cubic-bezier(.16,1,.3,1);   /* screens, sheets entering */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:160ms; --dur-std:280ms; --dur-slow:420ms; --dur-arrive:560ms;

  /* spacing scale: 4 8 12 16 20 24 32 40 48 64 */
  --tap:48px;               /* minimum touch target */
  color-scheme:light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1113; --bg-2:#221619; --surface:#261A1D; --surface-2:#33232A;
    --fg:#F6E9E6; --fg-2:#CDB7B9; --fg-3:#9A8588;
    --accent:#D96F7E; --accent-fg:#1F0E12; --accent-soft:#4A2A33;
    --border:#3B2A2E; --focus:0 0 0 3px rgba(217,111,126,.35);
    --blush-pale:#33232A; --blush:#4A2A33; --cream-deep:#221619; --paper:#261A1D;
    --gold:#E2B45C; --gold-pale:#3E3220; --leaf:#7DB38A; --leaf-pale:#223328;
    --sky:#7FA9C4; --sky-pale:#1F2E38; --alert:#E07A66; --alert-pale:#3E241F;
    --rose:#D96F7E;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6); --sh-up:0 -8px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1113; --bg-2:#221619; --surface:#261A1D; --surface-2:#33232A;
  --fg:#F6E9E6; --fg-2:#CDB7B9; --fg-3:#9A8588;
  --accent:#D96F7E; --accent-fg:#1F0E12; --accent-soft:#4A2A33;
  --border:#3B2A2E; --focus:0 0 0 3px rgba(217,111,126,.35);
  --blush-pale:#33232A; --blush:#4A2A33; --cream-deep:#221619; --paper:#261A1D;
  --gold:#E2B45C; --gold-pale:#3E3220; --leaf:#7DB38A; --leaf-pale:#223328;
  --sky:#7FA9C4; --sky-pale:#1F2E38; --alert:#E07A66; --alert-pale:#3E241F;
  --rose:#D96F7E;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 6px 18px rgba(0,0,0,.45); --sh-3:0 18px 48px rgba(0,0,0,.6); --sh-up:0 -8px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* base */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.display{font-family:var(--font-display);line-height:var(--lh-tight);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:var(--fs-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* signature motif: outlined Devanagari wordmark */
.wordmark{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.wordmark--outline{color:transparent;-webkit-text-stroke:1.5px currentColor;opacity:.22}

/* block-print texture (use as background-image on hero/brand bands, opacity via colour alpha) */
/* a 4-petal "buta" motif — tile 56px */
:root{
  --buta:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='rgba(255,246,243,0.16)' stroke-width='1.2'><path d='M28 10c4 6 4 12 0 18-4-6-4-12 0-18zM28 28c4 6 4 12 0 18-4-6-4-12 0-18zM10 28c6-4 12-4 18 0-6 4-12 4-18 0zM28 28c6-4 12-4 18 0-6 4-12 4-18 0z'/><circle cx='28' cy='28' r='2.2'/><circle cx='4' cy='4' r='1.2'/><circle cx='52' cy='52' r='1.2'/></g></svg>");
}

/* ================= ZARIYA DESKTOP — app styles (tokens above are verbatim) ================= */
:root{
  --on-art:#FFF6F3;              /* text/icons on fixed-colour art + maroon bands (same in both themes) */
  --band:var(--maroon);          /* brand band stays maroon in both themes */
  --accent-hover:var(--maroon-deep);
  --scrim:rgba(43,26,29,.42);
  --side-w:264px; --rail-w:300px; --top-h:72px; --gut:32px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --accent-hover:#E8909B; --scrim:rgba(10,4,6,.66); --band:#5E1423; } }
:root[data-theme="dark"]{ --accent-hover:#E8909B; --scrim:rgba(10,4,6,.66); --band:#5E1423; }
html.big{ --fs-body:17.5px; --fs-sm:15.5px; --fs-xs:14px; --fs-micro:12.5px; --fs-h3:18.5px; --fs-h2:22px; --fs-h1:28px; }
html[lang=hi] h1,html[lang=hi] h2,html[lang=hi] h3{line-height:1.25}
html[lang=hi] .eyebrow{letter-spacing:.02em;text-transform:none;font-size:calc(var(--fs-micro) + 1px)}
body{overflow-x:hidden;min-width:0}
::selection{background:var(--blush)}
a{color:var(--sky)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app grid ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
@media (max-width:1199px){ :root{--side-w:76px} }
@media (max-width:900px){ :root{--gut:20px} }

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);overflow:hidden;user-select:none;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;padding:26px 24px 22px;color:var(--accent);text-decoration:none;border-radius:var(--r-md)}
.brand-wm{font-size:38px;line-height:1;color:var(--accent)}
.brand-en{font-family:var(--font-display);font-weight:700;font-size:var(--fs-xs);letter-spacing:.22em;color:var(--fg-3)}
.nav{display:flex;flex-direction:column;gap:4px;padding:6px 14px}
.nav-i{display:flex;align-items:center;gap:14px;height:48px;padding:0 14px;border-radius:var(--r-pill);color:var(--fg-2);font-weight:600;font-size:var(--fs-body);transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast);position:relative;text-align:left;width:100%}
.nav-i svg{flex:none}
.nav-i:hover{background:var(--bg-2);color:var(--fg)}
.nav-i[aria-current="page"]{background:var(--blush-pale);color:var(--accent)}
.nav-i[aria-current="page"]::before{content:'';position:absolute;left:-14px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav-badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:var(--r-pill);background:var(--leaf-pale);color:var(--leaf);font-size:var(--fs-micro);font-weight:700;display:grid;place-items:center}
.side-sep{height:1px;background:var(--border);margin:14px 28px}
.side-card{margin:6px 16px 0;padding:14px 16px;border-radius:var(--r-md);background:var(--bg-2);display:flex;gap:12px;align-items:center;font-size:var(--fs-sm);color:var(--fg-2);line-height:1.35}
.side-card b{color:var(--fg);font-family:var(--font-display);font-size:var(--fs-h3);display:block}
.side-card .flame{color:var(--alert)}
.side-foot{margin-top:auto;padding:16px 16px 132px;position:relative;display:flex;flex-direction:column;gap:12px}
.side-wm{position:absolute;left:-14px;bottom:-42px;font-size:120px;line-height:1;color:var(--accent);pointer-events:none;white-space:nowrap}
.seg{display:flex;padding:4px;background:var(--bg-2);border-radius:var(--r-pill);gap:2px;position:relative;z-index:1}
.seg button{flex:1;height:36px;padding:0 12px;border-radius:var(--r-pill);font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);transition:background var(--dur-fast),color var(--dur-fast);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--sh-1)}
.row-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:0 6px 0 12px;border-radius:var(--r-md);font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);position:relative;z-index:1;text-align:left}
.row-switch:hover{background:var(--bg-2);color:var(--fg)}
.row-switch .lbl{display:flex;align-items:center;gap:10px}
.sw{width:42px;height:24px;border-radius:var(--r-pill);background:var(--blush);position:relative;flex:none;transition:background var(--dur-std) var(--ease-standard)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:var(--sh-1);transition:transform var(--dur-std) var(--ease-emphasized)}
[aria-checked="true"] .sw{background:var(--accent)}
[aria-checked="true"] .sw::after{transform:translateX(18px)}
@media (max-width:1199px){
  .brand{padding:24px 0 18px;justify-content:center}
  .brand-wm{font-size:22px}.brand-en{display:none}
  .nav{padding:6px 10px}
  .nav-i{justify-content:center;padding:0;width:56px;margin:0 auto;border-radius:var(--r-md)}
  .nav-i .t,.nav-badge,.side-card,.side-sep{display:none}
  .nav-i[aria-current="page"]::before{left:-10px}
  .side-foot{padding:12px 10px 104px;align-items:center}
  .seg{flex-direction:column;width:52px}
  .seg button{padding:0}
  .row-switch{justify-content:center;width:52px;padding:0}
  .row-switch .t,.row-switch .sw{display:none}
  .side-wm{font-size:96px;left:-10px;bottom:-34px}
}
/* rail tooltips */
@media (max-width:1199px){
  .nav-i[data-tip]:hover::after,.nav-i[data-tip]:focus-visible::after{content:attr(data-tip);position:fixed;left:84px;transform:translateY(0);background:var(--fg);color:var(--bg);padding:4px 10px;border-radius:var(--r-xs);font-size:var(--fs-xs);white-space:nowrap;pointer-events:none}
}

/* ---------- main + top bar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top-h);display:flex;align-items:center;gap:20px;padding:0 var(--gut);background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(1.2) blur(14px);-webkit-backdrop-filter:saturate(1.2) blur(14px);border-bottom:1px solid color-mix(in oklab,var(--border) 70%,transparent)}
.top-title{min-width:0;flex:1}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap;overflow:hidden}
.crumbs button{color:var(--fg-3);border-radius:var(--r-xs);padding:0 2px}
.crumbs button:hover{color:var(--accent);text-decoration:underline}
.crumbs .cur{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.top h1{font-size:var(--fs-h2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;display:flex;align-items:center;width:min(380px,36vw);height:46px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 6px 0 16px;gap:10px;color:var(--fg-3);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.search:focus-within{border-color:var(--accent);box-shadow:var(--focus)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--fs-sm);color:var(--fg);height:100%}
.search input::placeholder{color:var(--fg-3)}
.mic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blush-pale);color:var(--accent);flex:none;transition:background var(--dur-fast),transform var(--dur-fast)}
.mic:hover{background:var(--blush)}
.mic:active{transform:scale(.94)}
.search.listening{border-color:var(--accent)}
.search.listening .mic{background:var(--accent);color:var(--accent-fg)}
.listen-ov{position:absolute;inset:0 48px 0 16px;display:none;align-items:center;gap:10px;color:var(--accent);font-weight:600;font-size:var(--fs-sm);background:var(--surface)}
.search.listening .listen-ov{display:flex}
.eq{display:inline-flex;gap:3px;align-items:center;height:18px}
.eq i{width:3px;height:100%;border-radius:2px;background:currentColor;animation:eq .9s var(--ease-standard) infinite;transform-origin:center}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--fg-2);position:relative;flex:none;transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast)}
.ibtn:hover{background:var(--bg-2);color:var(--fg)}
.ibtn:active{transform:scale(.95)}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 2px var(--bg)}
.me{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 4px;border-radius:var(--r-pill);transition:background var(--dur-fast)}
.me:hover{background:var(--bg-2)}
.me .nm{font-weight:600;font-size:var(--fs-sm)}
@media (max-width:1100px){ .me .nm,.me .chev{display:none} .me{padding:0 4px} }
.pop{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:8px;z-index:40;animation:popIn var(--dur-std) var(--ease-arrive)}
.pop.wide{width:380px;padding:6px 6px 10px}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.menu-i{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:500;color:var(--fg-2);text-align:left}
.menu-i:hover{background:var(--bg-2);color:var(--fg)}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}
.pop-h h3{font-size:var(--fs-h3)}

.content{container:main/inline-size;width:100%;max-width:calc(1440px - var(--side-w));padding:28px var(--gut) 64px;margin:0}
@media (min-width:1700px){ .content{margin:0 auto} }
.view.enter{animation:viewIn 200ms var(--ease-arrive) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);min-width:0;position:relative}
.card.pad{padding:22px 24px}
.hov{transition:transform var(--dur-std) var(--ease-emphasized),box-shadow var(--dur-std) var(--ease-standard),border-color var(--dur-std)}
.hov:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:color-mix(in oklab,var(--border) 60%,var(--accent-soft))}
.hov:has(:focus-visible){box-shadow:var(--sh-2),var(--focus)}
.stretch::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:1}
.stretch:focus-visible{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h2{font-size:var(--fs-h3)}
.card-h .sub{font-size:var(--fs-xs);color:var(--fg-3);margin-top:2px}
.link{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);font-weight:600;color:var(--accent);border-radius:var(--r-xs);padding:2px 4px;white-space:nowrap}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--r-pill);font-weight:600;font-size:var(--fs-sm);white-space:nowrap;transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast),transform var(--dur-fast),box-shadow var(--dur-fast);position:relative;z-index:2}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 2px 0 color-mix(in oklab,var(--maroon-deep) 60%,transparent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:var(--blush-pale);color:var(--accent)}
.btn.sec:hover{background:var(--blush)}
.btn.ghost{color:var(--fg-2);border:1px solid var(--border);background:var(--surface)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{height:38px;padding:0 14px;font-size:var(--fs-xs)}
.btn.full{width:100%}
.btn.on-band{background:var(--on-art);color:var(--maroon)}
.btn.on-band:hover{background:var(--blush)}
.btn[disabled]{opacity:.55;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:600;background:var(--bg-2);color:var(--fg-2);white-space:nowrap}
.chip.leaf{background:var(--leaf-pale);color:var(--leaf)}
.chip.gold{background:var(--gold-pale);color:color-mix(in oklab,var(--gold) 70%,var(--fg))}
.chip.alert{background:var(--alert-pale);color:var(--alert)}
.chip.sky{background:var(--sky-pale);color:var(--sky)}
.chip.blush{background:var(--blush-pale);color:var(--accent)}
.chip.line{background:none;border:1px solid var(--border)}
.av{--h:var(--rose);width:40px;height:40px;border-radius:50%;background:var(--h);color:var(--on-art);display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:16px;flex:none;position:relative;line-height:1}
.av.sm{width:30px;height:30px;font-size:13px}
.av.xs{width:24px;height:24px;font-size:11px}
.av.lg{width:56px;height:56px;font-size:22px}
.av .on{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 2.5px var(--surface)}
.av.sm .on,.av.xs .on{width:9px;height:9px;box-shadow:0 0 0 2px var(--surface)}
.stack{display:inline-flex}
.stack .av{box-shadow:0 0 0 2px var(--surface)}
.stack .av+.av{margin-left:-8px}
.mark{--h:var(--maroon);width:48px;height:48px;border-radius:var(--r-sm);background:var(--h);color:var(--on-art);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;letter-spacing:-.01em;flex:none;line-height:1;text-align:center;padding:0 3px;overflow:hidden;position:relative}
.mark::after{content:'';position:absolute;inset:0;background:var(--buta) center/28px;opacity:.6}
.mark span{position:relative;z-index:1}
.tick{width:22px;height:22px;border-radius:50%;background:var(--leaf);color:var(--leaf-pale);display:inline-grid;place-items:center;flex:none}
.bar{height:8px;border-radius:var(--r-pill);background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--w);border-radius:inherit;background:var(--accent);transform-origin:left}
.enter .bar>i{animation:grow 900ms var(--ease-arrive) 120ms both}
@keyframes grow{from{transform:scaleX(0)}}
.flame{color:var(--alert)}

/* course / work art */
.art{--a0:#8C2F3F;--a1:#C4616F;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--a0),var(--a1));border-radius:var(--r-md);color:var(--on-art);isolation:isolate}
.art::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px;opacity:.85;z-index:-1}
.art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(43,26,29,.38));z-index:-1}
.art .ic{position:absolute;right:-6%;bottom:-10%;width:58%;height:auto;max-height:110%;opacity:.34;z-index:-1}
.art .at{position:absolute;left:14px;right:30%;bottom:12px;font-family:var(--font-display);font-weight:700;line-height:1.15;font-size:var(--fs-h3);text-wrap:balance;text-shadow:0 1px 8px rgba(43,26,29,.25)}
.ratio-16-11{aspect-ratio:16/11}.ratio-16-10{aspect-ratio:16/10}.ratio-16-9{aspect-ratio:16/9}.ratio-1{aspect-ratio:1}

/* band (maroon + buta + outlined wordmark) */
.band{position:relative;overflow:hidden;background:var(--band);color:var(--on-art);border-radius:var(--r-xl);isolation:isolate}
.band::before{content:'';position:absolute;inset:0;background-image:var(--buta);background-size:56px;z-index:-1}
.band::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 140% at 0% 0%,color-mix(in oklab,var(--rose) 38%,transparent),transparent 55%);z-index:-1}
.wordmark--outline{-webkit-text-fill-color:transparent}
.band .wordmark--outline{position:absolute;color:var(--on-art);opacity:.2;pointer-events:none;line-height:1;white-space:nowrap;z-index:-1;-webkit-text-stroke-width:1.6px}

/* ---------- DASHBOARD ---------- */
.dash{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.dash-main{display:grid;gap:24px;min-width:0}
.rail{display:grid;gap:20px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
@container main (min-width:1060px){
  .dash{grid-template-columns:minmax(0,1fr) var(--rail-w)}
  .dash .hero{grid-column:1/-1}
  .rail{grid-template-columns:1fr;position:sticky;top:calc(var(--top-h) + 24px)}
}
@container main (max-width:720px){ .rail{grid-template-columns:1fr} }
.hero{padding:30px 34px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;min-height:168px}
.hero .wordmark--outline{right:-30px;top:-34px;font-size:220px}
.hero .eyebrow{color:color-mix(in oklab,var(--on-art) 72%,transparent)}
.hero h2{font-size:var(--fs-hero);font-weight:800;margin:6px 0 2px}
.hero p{margin:0;color:color-mix(in oklab,var(--on-art) 82%,transparent);font-size:var(--fs-body)}
.hero-r{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill-band{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-pill);background:rgba(255,246,243,.14);border:1px solid rgba(255,246,243,.22);font-weight:600;font-size:var(--fs-sm);color:var(--on-art);white-space:nowrap;backdrop-filter:blur(4px)}
.pill-band .fl{color:var(--gold-pale)}
button.pill-band:hover{background:rgba(255,246,243,.24)}

.r1{display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 236px;grid-template-rows:auto auto}
.r1 .cont{grid-row:1/3}
@container main (max-width:820px){ .r1{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .r1 .cont{grid-row:auto;grid-column:1/-1} }
.cont{display:grid;grid-template-columns:minmax(150px,38%) minmax(0,1fr);gap:24px;padding:18px;align-items:stretch}
.cont .art{min-height:236px;border-radius:var(--r-md)}
.cont .art .ic{width:92%;right:-14%;bottom:-12%}
.segs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin-top:2px}
.segs i{height:10px;border-radius:var(--r-pill);background:var(--accent-soft)}
.segs i.d{background:var(--accent)}
.segs i.c{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.enter .segs i.d{animation:grow 600ms var(--ease-arrive) both;animation-delay:calc(var(--i)*60ms + 100ms)}
.cont-b{display:flex;flex-direction:column;min-width:0;padding:6px 6px 4px 0}
.cont-b h3{font-size:var(--fs-h1);margin:6px 0 4px}
.cont-b .ln{color:var(--fg-2);font-size:var(--fs-body);margin:0}
.cont-b .by{color:var(--fg-3);font-size:var(--fs-xs);margin:2px 0 0}
.prog{margin-top:auto;padding-top:18px}
.prog-l{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-xs);color:var(--fg-3);margin-bottom:8px}
.prog-l b{color:var(--fg);font-family:var(--font-display);font-size:var(--fs-h3)}
.cont-a{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tile{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.tile-row{display:flex;align-items:center;gap:16px}
.tile-row .ring{margin:0}
.tile-row .cap{line-height:1.35}
.tile .cap{font-size:var(--fs-xs);color:var(--fg-3)}
.ring{position:relative;width:104px;height:104px;margin:6px auto 2px}
.ring svg{transform:rotate(-90deg);display:block}
.ring .trk{stroke:var(--accent-soft)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease-arrive)}
.enter .ring .val{animation:ring 1100ms var(--ease-arrive) 120ms both}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .mid b{font-family:var(--font-display);font-size:30px;font-weight:800}
.ring .mid span{font-size:var(--fs-micro);color:var(--fg-3);margin-top:4px}
.tile .cap.c{text-align:center}
.cert-tile{background:linear-gradient(160deg,var(--gold-pale),var(--surface) 70%)}
.cert-n{display:flex;align-items:center;gap:12px;margin:4px 0}
.cert-n{gap:6px}
.r1 .tile{justify-content:center}
.cert-n b{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;color:var(--fg)}
.seal{color:var(--gold);flex:none}

.r2{display:grid;gap:20px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@container main (max-width:820px){ .r2{grid-template-columns:1fr} }
.wk-sum{display:flex;align-items:baseline;gap:8px}
.wk-sum b{font-family:var(--font-display);font-size:var(--fs-h1);font-weight:800;line-height:1}
.wk-sum span{font-size:var(--fs-xs);color:var(--fg-3)}

/* bar chart (single series; dataviz rules: one scale, hairline grid, 24px max bars, 4px data-end) */
.chart{display:grid;grid-template-columns:28px minmax(0,1fr);grid-template-rows:170px auto;column-gap:8px}
.ch-y{position:relative;font-size:var(--fs-micro);color:var(--fg-3)}
.ch-y span{position:absolute;right:0;transform:translateY(-50%);line-height:1}
.ch-plot{position:relative;border-bottom:1px solid color-mix(in oklab,var(--fg-3) 45%,transparent)}
.ch-g{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--border)}
.ch-g.faint{border-top-color:color-mix(in oklab,var(--border) 55%,transparent)}
.ch-goal{position:absolute;right:0;top:-18px;font-size:var(--fs-micro);color:var(--fg-3)}
.ch-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.ch-col{position:relative;display:flex;justify-content:center;align-items:flex-end;height:100%;outline:none;border-radius:var(--r-xs) var(--r-xs) 0 0;cursor:default}
.ch-col:hover,.ch-col:focus-visible{background:color-mix(in oklab,var(--accent-soft) 35%,transparent)}
.ch-col:focus-visible{box-shadow:var(--focus)}
.ch-bar{width:min(24px,56%);height:calc(var(--v) * 100%);background:color-mix(in oklab,var(--accent) 34%,var(--surface));border-radius:4px 4px 0 0;transform-origin:bottom;transition:background var(--dur-fast)}
.ch-col:hover .ch-bar{background:color-mix(in oklab,var(--accent) 55%,var(--surface))}
.ch-col.today .ch-bar{background:var(--accent)}
.enter .ch-bar{animation:rise 800ms var(--ease-arrive) both;animation-delay:calc(var(--i) * 50ms + 100ms)}
@keyframes rise{from{transform:scaleY(0)}}
.ch-val{position:absolute;bottom:calc(var(--v) * 100% + 6px);left:50%;transform:translateX(-50%);font-family:var(--font-display);font-weight:700;font-size:var(--fs-sm);color:var(--fg);line-height:1}
.ch-tip{position:absolute;bottom:calc(var(--v) * 100% + 30px);left:50%;transform:translate(-50%,4px);background:var(--fg);color:var(--bg);font-size:var(--fs-xs);padding:6px 10px;border-radius:var(--r-xs);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--dur-fast),transform var(--dur-fast);z-index:3;line-height:1.3;text-align:center}
.ch-tip b{font-family:var(--font-display);font-size:var(--fs-sm)}
.ch-col:hover .ch-tip,.ch-col:focus-visible .ch-tip{opacity:1;transform:translate(-50%,0)}
.ch-x{grid-column:2;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:var(--fs-xs);color:var(--fg-3);padding-top:8px}
.ch-x .today{color:var(--accent);font-weight:700}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px;margin:0 -12px;border-radius:var(--r-md);position:relative;transition:background var(--dur-fast);text-align:left;width:calc(100% + 24px)}
.li:hover{background:var(--bg-2)}
.r2 .li .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li+.li{border-top:1px solid var(--border)}
.li:hover+.li,.li:hover{border-top-color:transparent}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:var(--fs-sm);line-height:1.3;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{display:block;font-size:var(--fs-xs);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{color:var(--fg-3);flex:none;transition:transform var(--dur-fast)}
.li:hover .chev{transform:translateX(3px);color:var(--accent)}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px}
.sec-h h2{font-size:var(--fs-h2)}
.grid4{display:grid;gap:18px;grid-template-columns:repeat(4,minmax(0,1fr))}
@container main (max-width:700px){ .grid4{grid-template-columns:repeat(2,minmax(0,1fr))} }
.ccard{padding:10px 10px 14px;display:flex;flex-direction:column;gap:10px}
.ccard .art .at{display:none}
.ccard h3{font-size:var(--fs-body);font-weight:700;line-height:1.25;padding:0 4px}
.ccard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px;font-size:var(--fs-xs);color:var(--fg-3)}
.ccard .by{font-size:var(--fs-xs);color:var(--fg-3);padding:0 4px;margin-top:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{color:var(--gold);display:inline-flex;align-items:center;gap:3px;font-weight:600}
.star b{color:var(--fg)}

.wrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto auto 24px;align-items:center;gap:18px;padding:14px 12px;margin:0 -12px;border-radius:var(--r-md);position:relative;transition:background var(--dur-fast)}
.wrow:hover{background:var(--bg-2)}
.wrow+.wrow{border-top:1px solid var(--border)}
.wrow .art{width:56px;height:56px;border-radius:var(--r-sm)}
.wrow .art .ic{width:80%;right:-10%;bottom:-10%;opacity:.5}
.wrow .tx b{display:block;font-weight:700;font-size:var(--fs-body);font-family:var(--font-display);line-height:1.25}
.wrow .tx span{font-size:var(--fs-xs);color:var(--fg-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.km{font-family:var(--font-display);font-weight:800;font-size:var(--fs-h2);line-height:1;white-space:nowrap}
.km small{font-size:var(--fs-xs);font-weight:600;color:var(--fg-3);margin-left:2px}
.pay{font-weight:600;font-size:var(--fs-sm);white-space:nowrap}
@container main (max-width:860px){ .wrow{grid-template-columns:56px minmax(0,1fr) auto 24px} .wrow .pay,.wrow .fchip{display:none} }

.ncard .ni{display:flex;gap:12px;padding:10px;margin:0 -10px;border-radius:var(--r-md);position:relative}
.ncard .ni:hover{background:var(--bg-2)}
.nk{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.nk.work{background:var(--alert-pale);color:var(--alert)}
.nk.friend{background:var(--leaf-pale);color:var(--leaf)}
.nk.scheme{background:var(--gold-pale);color:color-mix(in oklab,var(--gold) 75%,var(--fg))}
.ni p{margin:0;font-size:var(--fs-sm);line-height:1.4;color:var(--fg)}
.ni time{display:block;font-size:var(--fs-micro);color:var(--fg-3)}
.ni.unread::after{content:'';position:absolute;right:6px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.ni.unread p{padding-right:14px}
.cal{width:52px;flex:none;border-radius:var(--r-sm);overflow:hidden;text-align:center;border:1px solid var(--border);background:var(--surface)}
.cal span{display:block;background:var(--band);color:var(--on-art);font-size:var(--fs-micro);font-weight:700;letter-spacing:.06em;padding:2px 0}
.cal b{display:block;font-family:var(--font-display);font-size:22px;line-height:1.4}
.up{display:flex;gap:14px;align-items:flex-start}
.up p{margin:0 0 10px;font-size:var(--fs-sm);line-height:1.4}
.fr{display:flex;align-items:center;gap:12px;padding:8px 0}
.fr .tx b{display:block;font-size:var(--fs-sm);font-weight:600;line-height:1.2}
.fr .tx span{font-size:var(--fs-xs);color:var(--fg-3)}
.fr .tx span.live{color:var(--leaf)}

/* toast */
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;pointer-events:none;align-items:center}
.toast{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);box-shadow:var(--sh-3);font-size:var(--fs-sm);font-weight:500;animation:toastIn var(--dur-slow) var(--ease-arrive);max-width:min(560px,90vw)}
.toast .tick{width:20px;height:20px}
.toast.out{animation:toastOut var(--dur-std) var(--ease-standard) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ---------- MY COURSES ---------- */
.sumrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.stat{padding:16px 20px;display:flex;align-items:center;gap:14px}
.stat .si{width:44px;height:44px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--blush-pale);color:var(--accent);flex:none}
.stat .si.leaf{background:var(--leaf-pale);color:var(--leaf)}.stat .si.gold{background:var(--gold-pale);color:var(--gold)}.stat .si.sky{background:var(--sky-pale);color:var(--sky)}
.stat b{display:block;font-family:var(--font-display);font-size:var(--fs-h1);font-weight:800;line-height:1.1}
.stat span{font-size:var(--fs-xs);color:var(--fg-3)}
@container main (max-width:760px){ .sumrow{grid-template-columns:repeat(2,minmax(0,1fr))} }
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.tabs{--n:4;--x:0;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:var(--bg-2);border-radius:var(--r-pill);padding:4px;min-width:min(440px,100%)}
.tabs::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/var(--n));border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-1);transform:translateX(calc(var(--x) * 100%));transition:transform var(--dur-std) var(--ease-emphasized)}
.tabs button{position:relative;height:40px;padding:0 14px;border-radius:var(--r-pill);font-weight:600;font-size:var(--fs-sm);color:var(--fg-2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent)}
.tabs .cnt{font-size:var(--fs-micro);font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--blush-pale);color:var(--accent);display:grid;place-items:center}
.field{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);color:var(--fg-3);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.field:focus-within{border-color:var(--accent);box-shadow:var(--focus)}
.field input,.field select{border:0;background:none;outline:none;font-size:var(--fs-sm);color:var(--fg);height:100%;min-width:0}
.field select{cursor:pointer;padding-right:4px}
.field.grow{flex:1;min-width:200px}
.field.grow input{flex:1}
.cgrid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.cc{display:flex;flex-direction:column;padding:10px;gap:0}
.cc .art{border-radius:var(--r-md)}
.cc .art .ic{width:46%;right:-4%;bottom:-8%}
.cc .lvl{position:absolute;left:10px;top:10px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:rgba(43,26,29,.28);color:var(--on-art);font-size:var(--fs-micro);font-weight:600;display:inline-flex;align-items:center;backdrop-filter:blur(4px)}
.heart{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,246,243,.9);color:var(--maroon);z-index:3;transition:transform var(--dur-fast) var(--ease-spring),background var(--dur-fast);box-shadow:var(--sh-1)}
.heart:hover{transform:scale(1.08)}
.heart:active{transform:scale(.92)}
.heart[aria-pressed="true"] svg{fill:currentColor}
.heart[aria-pressed="true"]{animation:pop var(--dur-slow) var(--ease-spring)}
@keyframes pop{40%{transform:scale(1.2)}}
.cc-b{padding:14px 6px 6px;display:flex;flex-direction:column;gap:4px;flex:1}
.cc-b h3{font-size:var(--fs-h3);line-height:1.25}
.cc-b .by{font-size:var(--fs-xs);color:var(--fg-3);margin:0 0 10px}
.cc-f{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.cc-m{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-xs);color:var(--fg-3);gap:8px}
.cc-m b{color:var(--fg);font-weight:700}
.badge-cert{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border-radius:var(--r-pill);background:var(--gold-pale);color:color-mix(in oklab,var(--gold) 65%,var(--fg));font-weight:700;font-size:var(--fs-xs);position:relative;z-index:2}
button.badge-cert:hover{filter:brightness(.97);box-shadow:0 0 0 1px var(--gold)}
.badge-cert .seal{color:var(--gold)}

.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);position:relative}

.pbody{padding:18px 20px 20px}

function ring(val, max, size = 104, sw = 9) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(val / max, 1));

    <div class="mid"><b>${val}</b><span>/ ${max} ${esc(t('min'))}</span></div></div>`;
}

function weekChart() {
  const w = weekArr(); const max = 60, days = t('days'), names = t('dayNames');

      <div class="ch-bar"></div>${i === TODAY_IDX ? `<span class="ch-val num">${v}</span>` : ''}
      <span class="ch-tip"><b class="num">${v}</b> ${esc(t('min'))}<br>${esc(names[i])}</span></div>`).join('');
  return `<div class="chart" role="figure" aria-label="${esc(t('chartAlt'))}">
    <div class="ch-y num" aria-hidden="true"><span style="top:0">60</span><span style="top:50%">30</span><span style="top:100%">0</span></div>
    <div class="ch-plot"><div class="ch-g" style="top:0"></div><div class="ch-g faint" style="top:50%"></div><div class="ch-cols">${cols}</div></div>
    <div class="ch-x" aria-hidden="true">${days.map((d, i) => `<span class="${i === 6 ? 'today' : ''}">${i === 6 ? esc(t('today')) : esc(d)}</span>`).join('')}</div>
  </div>
  <table class="sr"><caption>${esc(t('chartAlt'))}</caption><tbody>${w.map((v, i) => `<tr><th>${esc(names[i])}</th><td>${v} ${esc(t('min'))}</td></tr>`).join('')}</tbody></table>`;
}

function toast(msg, ok = true) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `${ok ? tick(12) : ''}<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  navigator.vibrate?.(8);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 2400);
}

/* ---------- MY COURSES ---------- */
const cState = (c) => (isDone(c) ? 'completed' : S.done[c.id] > 0 ? 'ongoing' : 'new');
const matchQ = (c, q) => { if (!q) return true; q = q.toLowerCase(); return [c.title.en, c.title.hi, c.by.en, c.by.hi].some((x) => x.toLowerCase().includes(q)); };
function courseList() {
  let list = D.courses.filter((c) => matchQ(c, S.coursesQ));
  if (S.coursesTab === 'ongoing') list = list.filter((c) => cState(c) === 'ongoing');
  if (S.coursesTab === 'completed') list = list.filter((c) => cState(c) === 'completed');
  if (S.coursesTab === 'saved') list = list.filter((c) => S.saved.has(c.id));
  const rank = { ongoing: 0, new: 1, completed: 2 };
  if (S.sort === 'recent') list.sort((a, b) => rank[cState(a)] - rank[cState(b)] || pct(b) - pct(a));
  if (S.sort === 'popular') list.sort((a, b) => b.learners - a.learners);
  if (S.sort === 'short') list.sort((a, b) => a.mins - b.mins);
  return list;
}
function courseCard(c) {
  const st = cState(c), sv = S.saved.has(c.id);
  const foot = st === 'completed'
    ? `<div class="cc-m"><button class="badge-cert" data-act="cert" data-arg="${c.id}"><span class="seal">${sealSvg(24)}</span>${esc(t('certificate'))}</button><span class="star">${ic('star', 14)}<b class="num">${c.rating}</b></span></div>`
    : st === 'ongoing'
      ? `<div class="cc-m"><span>${esc(t('lessonsDoneN', { d: S.done[c.id], n: c.lessons }))}</span><b class="num">${pct(c)}%</b></div>${progress(pct(c))}`
      : `<div class="cc-m"><span>${ic('clock', 14)} <span class="num">${c.lessons}</span> ${esc(t('lessons'))} · <span class="num">${Math.round(c.mins / 6) / 10}</span> ${esc(t('hrs'))}</span><span class="star">${ic('star', 14)}<b class="num">${c.rating}</b></span></div><div class="cc-m"><span class="chip line">${esc(t('notStarted'))}</span><span><span class="num">${nf(c.learners)}</span> ${esc(t('learners'))}</span></div>`;
  return `<article class="card cc hov">
    <div style="position:relative">${art(c, { cls: 'ratio-16-10' })}<span class="lvl">${esc(L(c.level))}</span>
      <button class="heart" data-act="heart" data-arg="${c.id}" aria-pressed="${sv}" aria-label="${esc(sv ? t('savedCourse') : t('saveCourse'))}: ${esc(L(c.title))}">${ic('heart', 20)}</button></div>

  </article>`;
}
function courseGrid() {
  const list = courseList();
  if (!list.length) {
    const saved = S.coursesTab === 'saved' && !S.coursesQ;

function togglePlay(force) {
  const P = S.player; const on = force ?? !P.playing;
  if (P.finished && on) { P.finished = false; P.pos = 0; }
  P.playing = on; clearInterval(timer); timer = null;
  if (on) timer = setInterval(tickPlayer, 250);
  refreshPlayer();
}
function tickPlayer() {
  const P = S.player; P.pos = Math.min(P.dur, P.pos + 5 * P.speed);
  if (P.pos >= P.dur) return finishLesson();
  const pl = document.getElementById('pl'); if (!pl) return;
  const p = (P.pos / P.dur) * 100;
  pl.querySelector('.scrub').style.setProperty('--p', p + '%');
  pl.querySelector('.scrub').setAttribute('aria-valuenow', Math.round(P.pos));
  pl.querySelector('.scrub').setAttribute('aria-valuetext', mmss(P.pos));
  pl.querySelector('.tm').textContent = `${mmss(P.pos)} / ${mmss(P.dur)}`;
}
function finishLesson() {
  const P = S.player, c = course(P.cid);
  stopTimer(); P.pos = P.dur; P.finished = true;
  if (P.n === S.done[c.id] + 1) { S.done[c.id] = P.n; S.minutesToday = Math.min(S.minutesToday + 20, 99); }

}

/* certificate (modal + mini) */
function qrSvg(seed, size = 72) {
  let x = 0; for (const ch of seed) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  const n = 15, cell = size / n; let r = '';
  const finder = (i, j) => { for (const [a, b] of [[0, 0], [0, n - 7], [n - 7, 0]]) { const u = i - a, v = j - b; if (u >= 0 && u < 7 && v >= 0 && v < 7) return (u === 0 || u === 6 || v === 0 || v === 6 || (u >= 2 && u <= 4 && v >= 2 && v <= 4)) ? 1 : 0; } return -1; };
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { let on = finder(i, j); if (on === -1) { x = (x * 1103515245 + 12345) >>> 0; on = (x >>> 16) & 1; } if (on) r += `M${(j * cell).toFixed(2)} ${(i * cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`; }
  return `<svg class="qr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><path d="${r}" fill="currentColor"/></svg>`;
}

        <table class="tbl"><thead><tr><th scope="col">${esc(t('place'))}</th><th scope="col">${esc(t('roleL'))}</th><th scope="col">${esc(t('dateL'))}</th><th scope="col">${esc(t('statusL'))}</th></tr></thead>
        <tbody>${S.applications.map((a) => { const j = job(a.job); return `<tr><td><span class="co">${art(j)}${esc(L(j.title))}</span></td><td class="rl">${esc(L(j.role))}</td><td class="num">${esc(fmtDate(a.date, { day: 'numeric', month: 'short' }))}</td><td><span class="st-pill ${a.st}">${esc(t(a.st))}</span></td></tr>`; }).join('')}</tbody></table></section>
      <section class="card pad" aria-labelledby="wl"><div class="card-h"><div><h2 id="wl">${esc(t('weeklyLearning'))}</h2><div class="sub">${esc(t('dailyGoal', { n: U.goalMinutes }))}</div></div><div class="wk-sum"><b class="num">${total}</b><span>${esc(t('weekTotal'))}</span></div></div>${weekChart()}</section>
      <section class="card pad set" id="settings" aria-labelledby="se"><div class="card-h" style="margin-bottom:6px"><h2 id="se">${esc(t('settings'))}</h2></div>
        <button class="row-switch" role="switch" aria-checked="${isDark()}" data-act="theme" data-k="s-theme"><span class="lbl">${ic('moon', 20)}${esc(t('darkMode'))}</span><span class="sw"></span></button>
        <button class="row-switch" role="switch" aria-checked="${S.big}" data-act="big"><span class="lbl">${ic('book', 20)}${esc(t('textSize'))}</span><span class="sw"></span></button>
        <button class="row-switch" role="switch" aria-checked="${S.readAloud}" data-act="readAloud"><span class="lbl">${ic('speaker', 20)}${esc(t('voiceHelp'))}</span><span class="sw"></span></button>
        <button class="row-switch" data-act="logout"><span class="lbl">${ic('logout', 20)}${esc(t('logout'))}</span>${ic('chevR', 18)}</button></section>
    </div>
  </div>`;
};
document.addEventListener('input', (e) => { const k = e.target.dataset?.field; if (k) { S.form = S.form || {}; S.form[k] = e.target.value; } });
Object.assign(ACT, {
  editProfile: () => { const i = document.querySelector('[data-field="name"]'); i?.focus(); i?.select(); },
  saveProfile: () => { if (S.form) { if (S.form.name != null) S.profile.name = S.form.name.trim() || null; ['phone', 'village', 'district'].forEach((k) => { if (S.form[k] != null) S.profile[k] = S.form[k]; }); S.form = null; } render(); toast(t('profileSaved')); },
  addHelper: () => { S.helper = true; render(); toast(t('helperReq')); },
  big: () => { S.big = !S.big; document.documentElement.classList.toggle('big', S.big); render(); },
  readAloud: () => { S.readAloud = !S.readAloud; render(); if (S.readAloud) toast(t('readAloudOn')); },
});
const _ar = afterRender;
afterRender = () => { _ar?.(); if (S.view === 'profile' && S.params.section === 'settings') { delete S.params.section; document.getElementById('settings')?.scrollIntoView({ block: 'center' }); } };
document.addEventListener('submit', (e) => { if (e.target.id === 'pform') { e.preventDefault(); ACT.saveProfile(); } });

/*@@VIEWS@@*/

/* ---------------- render + router ---------------- */
const isDark = () => (document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches);

function render() {
  const fk = document.activeElement?.dataset?.k || (document.activeElement?.dataset?.act ? document.activeElement.dataset.act + '|' + (document.activeElement.dataset.arg || '') : null);
  const entering = S.view !== S.prevView;
  const view = VIEWS[S.view] || VIEWS.home;
  document.getElementById('app').innerHTML = sidebar() + `<div class="main">${topbar()}<main class="content" id="main" tabindex="-1"><div class="view ${entering ? 'enter' : ''}" data-view="${S.view}">${view()}</div></main></div>`;
  document.getElementById('layer').innerHTML = (typeof layers === 'function') ? layers() : '';
  document.title = `${BRAND} · ${topTitle()}`;
  S.prevView = S.view;
  if (fk && !entering) {
    const [a, g] = fk.split('|');
    const el = document.querySelector(`[data-k="${CSS.escape(fk)}"]`) || document.querySelector(`[data-act="${CSS.escape(a)}"][data-arg="${CSS.escape(g || '')}"]`) || (g === '' ? document.querySelector(`[data-act="${CSS.escape(a)}"]:not([data-arg])`) : null);
    el?.focus({ preventScroll: true });
  }
  afterRender?.();
}

function go(view, params = {}, { replace = false, keepScroll = false } = {}) {
  if (view === 'course' && !params.id) params.id = 'sewing';
  S.view = view; S.params = params; S.menu = null;
  const st = { view, params };
  try { replace ? history.replaceState(st, '') : history.pushState(st, ''); } catch (e) { /* sandboxed */ }
  onRoute?.(view, params);
  render();
  if (!keepScroll) window.scrollTo({ top: 0 });
}
addEventListener('popstate', (e) => { const st = e.state; if (!st) return; S.view = st.view; S.params = st.params || {}; S.menu = null; onRoute?.(S.view, S.params); render(); });

function setLang(l) { LANG = l === 'hi' ? 'hi' : 'en'; document.documentElement.lang = LANG; try { localStorage.setItem('zariya_lang', LANG); } catch (e) {} render(); }
function setTheme(th) { const r = document.documentElement; if (th === 'light' || th === 'dark') r.dataset.theme = th; else delete r.dataset.theme; try { localStorage.setItem('zariya_theme', th || ''); } catch (e) {} render(); }

/* ---------------- actions ---------------- */
Object.assign(ACT, {
  go: (a, el) => go(a, el.dataset.arg2 ? { section: el.dataset.arg2 } : {}),
  lang: (a) => setLang(a),
  theme: () => setTheme(isDark() ? 'light' : 'dark'),
  menu: (a) => { S.menu = S.menu === a ? null : a; render(); },
  markRead: () => { S.unread.clear(); render(); },
  notif: (a) => { const n = D.notifications[+a]; S.unread.delete(+a); const [v, id] = NOTIF_GO[n.kind]; if (v === 'work') { S.drawer = id; S.drawerStep = 'detail'; go('work'); } else if (v === 'schemes') { S.schemeSel = id; S.forMe = true; go('schemes'); } else go(v, { id }); },
  logout: () => { S.menu = null; render(); toast(t('signedOut'), false); },
  remind: () => { S.reminder = !S.reminder; render(); if (S.reminder) toast(t('reminderSet')); },
  continue: () => { S.player.cid = 'sewing'; S.player.n = curN(course('sewing')); S.ctab = 'lessons'; go('course', { id: 'sewing' }); },
  course: (a) => { S.ctab = 'lessons'; go('course', { id: a }); },
  scheme: (a) => { S.schemeSel = a; go('schemes'); },
  job: (a) => { S.drawer = a; S.drawerStep = 'detail'; if (S.view !== 'work') go('work'); else render(); },
  mic: () => startListening(),
});

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (S.menu && !e.target.closest('.pop')) { S.menu = null; render(); } return; }
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (S.menu && el.dataset.act !== 'menu') S.menu = null;
  fn(el.dataset.arg, el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (typeof closeLayer === 'function' && closeLayer()) return; if (S.menu) { S.menu = null; render(); } }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'gsearch') { e.preventDefault(); const q = document.getElementById('gq').value.trim(); S.coursesQ = q; S.coursesTab = 'all'; go('courses'); }
});

let listenT = null;
function startListening() {
  const f = document.getElementById('gsearch'); if (!f || f.classList.contains('listening')) return;
  f.classList.add('listening'); navigator.vibrate?.(8);
  clearTimeout(listenT);
  listenT = setTimeout(() => { S.coursesQ = LANG === 'hi' ? 'सिलाई' : 'sewing'; S.coursesTab = 'all'; go('courses'); }, 1800);
}

/* ---------------- boot ---------------- */
(function boot() {
  try { const l = localStorage.getItem('zariya_lang'); if (l) LANG = l; const th = localStorage.getItem('zariya_theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  document.documentElement.lang = LANG;
  try { history.replaceState({ view: 'home', params: {} }, ''); } catch (e) {}
  render();
})();

window.Z = { go, setLang, setTheme, S, render, open: (k, v) => ACT[k]?.(v, { dataset: {} }) };
</script>
</body>
</html>
